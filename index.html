<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ChuToan Foto - Quản Lý Lịch Chụp</title>
    <style>
        /* --- HỆ THỐNG BIẾN - CHẾ ĐỘ SÁNG (LIGHT MODE) --- */
        :root {
            --bg-base: #f0f2f5;
            /* Tạo hình nền loang màu nhẹ để hiệu ứng kính hiển thị rõ */
            --bg-mesh: 
                radial-gradient(circle at 15% 50%, rgba(0, 122, 255, 0.08), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.08), transparent 40%);
            
            /* THÔNG SỐ KÍNH LỎNG (LIQUID GLASS) */
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            
            --text-main: #000000;
            --text-sub: rgba(60, 60, 67, 0.6);
            --accent-gold: #c59b27;
            --alert-red: #ff3b30;
            --success-green: #34c759;
            --blue-accent: #007aff;
            
            --btn-bg: rgba(0, 0, 0, 0.05);
            --input-bg: rgba(255, 255, 255, 0.5);
            --logo-filter: invert(1);
            --radius-card: 24px;
        }

        /* --- HỆ THỐNG BIẾN - CHẾ ĐỘ TỐI (DARK MODE) TỰ ĐỘNG --- */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-base: #000000;
                /* Nền tối có chút loang màu sang trọng */
                --bg-mesh: 
                    radial-gradient(circle at 20% 40%, rgba(10, 132, 255, 0.12), transparent 45%),
                    radial-gradient(circle at 80% 60%, rgba(212, 175, 55, 0.12), transparent 45%);
                
                /* KÍNH LỎNG CHUẨN IOS DARK MODE (Đen mờ trong suốt) */
                --glass-bg: rgba(40, 40, 40, 0.35); 
                --glass-border: rgba(255, 255, 255, 0.15);
                --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                
                --text-main: #ffffff;
                --text-sub: rgba(235, 235, 245, 0.6);
                --accent-gold: #ffd60a;
                --alert-red: #ff453a;
                --success-green: #30d158;
                --blue-accent: #0a84ff;
                
                --btn-bg: rgba(255, 255, 255, 0.1);
                --input-bg: rgba(0, 0, 0, 0.3);
                --logo-filter: none;
            }
        }

        /* --- RESET & BODY --- */
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            background-image: var(--bg-mesh);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 100px;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* HEADER LIQUID GLASS */
        .header {
            padding: 16px 20px; position: sticky; top: 0; z-index: 50;
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            display: flex; justify-content: space-between; align-items: center;
        }
        .header img { height: 34px; object-fit: contain; filter: var(--logo-filter); transition: filter 0.4s; }
        .status-dot {
            display: inline-block; width: 8px; height: 8px; background: var(--success-green);
            border-radius: 50%; box-shadow: 0 0 8px var(--success-green); margin-right: 6px;
        }

        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .section-title {
            font-size: 13px; font-weight: 700; color: var(--text-sub); 
            letter-spacing: 1px; margin-bottom: 12px; text-transform: uppercase; margin-left: 4px;
        }

        /* --- LỚP KÍNH CHUNG CHO THẺ (CARDS) --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--radius-card);
        }

        /* --- XỔ LỊCH THÁNG & NGÀY --- */
        .month-header {
            padding: 16px 20px; margin: 15px 0 8px 0;
            color: var(--accent-gold); font-weight: 700; font-size: 16px; 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: transform 0.2s;
        }
        .month-header:active { transform: scale(0.97); }
        .month-content { display: none; animation: fadeIn 0.3s ease; }
        .month-content.show { display: block; }

        .day-header {
            padding: 14px 18px; margin: 10px 0 8px 0; border-radius: 20px;
            color: var(--blue-accent); font-weight: 700; font-size: 15px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: transform 0.2s;
        }
        .day-header:active { transform: scale(0.97); }
        .day-content { display: none; animation: fadeIn 0.3s ease; }
        .day-content.show { display: block; }
        
        .toggle-icon { transition: transform 0.3s ease; font-size: 12px; opacity: 0.6;}

        /* --- THẺ LỊCH CHỤP (JOB CARD) --- */
        .card {
            padding: 20px; margin-bottom: 14px; cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .card:active { transform: scale(0.96); }
        
        .card-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 10px; border-bottom: 1px solid rgba(150, 150, 150, 0.15); padding-bottom: 12px;
        }
        .client-name { font-size: 18px; font-weight: 600; color: var(--text-main); margin: 0 0 4px 0; }
        .package-name { font-size: 14px; color: var(--accent-gold); margin: 0; font-weight: 500;}
        .shoot-time { font-size: 12px; background: var(--btn-bg); padding: 6px 12px; border-radius: 12px; font-weight: 600; color: var(--text-main);}
        
        .details-row { display: flex; margin-bottom: 8px; font-size: 14px; }
        .details-label { color: var(--text-sub); width: 90px; flex-shrink: 0; }
        
        .money-status {
            margin-top: 14px; padding-top: 14px; border-top: 1px dashed rgba(150, 150, 150, 0.2);
            display: flex; justify-content: space-between; font-weight: 600; font-size: 14px;
        }
        .debt { color: var(--alert-red); }
        .paid { color: var(--success-green); }

        .card-expanded-content {
            display: none; margin-top: 12px; padding-top: 12px;
            border-top: 1px solid rgba(150, 150, 150, 0.15); animation: fadeIn 0.3s ease;
        }
        .card-expanded-content.show { display: block; }
        
        .action-link-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px; background: var(--btn-bg);
            border-radius: 12px; color: var(--text-main); 
            text-decoration: none; font-size: 13px; font-weight: 600;
            margin-top: 8px; margin-right: 8px;
        }
        .action-link-btn.maps { color: var(--blue-accent); }
        .action-link-btn.drive { color: var(--success-green); }
        
        .card-btns-row {
            display: flex; gap: 12px; margin-top: 16px; padding-top: 16px;
            border-top: 1px dashed rgba(150, 150, 150, 0.2);
        }
        .btn-card-action {
            flex: 1; padding: 12px 0; border: none; border-radius: 14px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn-edit { background: var(--btn-bg); color: var(--text-main); }
        .btn-delete { background: rgba(255, 59, 48, 0.1); color: var(--alert-red); }

        /* --- DASHBOARD STATS --- */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
        .stat-card { padding: 18px; }
        .stat-label { font-size: 13px; color: var(--text-sub); margin-bottom: 6px; font-weight: 500;}
        .stat-value { font-size: 19px; font-weight: 700; }
        .stat-value.gold { color: var(--accent-gold); }
        .stat-value.green { color: var(--success-green); }
        .stat-value.red { color: var(--alert-red); }

        /* --- FAB & MODAL --- */
        .fab {
            position: fixed; bottom: 30px; right: 24px; width: 62px; height: 62px;
            background: var(--blue-accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 32px; font-weight: 300;
            box-shadow: 0 10px 25px rgba(0, 122, 255, 0.4);
            cursor: pointer; z-index: 90; transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .fab:active { transform: scale(0.85); }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px); z-index: 100;
            justify-content: center; align-items: flex-end; animation: fadeInModal 0.3s ease;
        }
        @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }
        .modal-content {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
            border-top: 1px solid var(--glass-border);
            box-shadow: 0 -20px 50px rgba(0,0,0,0.3);
            border-radius: 32px 32px 0 0; width: 100%; max-width: 600px;
            max-height: 92vh; overflow-y: auto; padding: 30px 20px; box-sizing: border-box;
            animation: slideUp 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-header h3 { margin: 0; font-size: 20px; color: var(--text-main); font-weight: 700; }
        .close-btn { font-size: 24px; color: var(--text-sub); cursor: pointer; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: var(--btn-bg); border-radius: 50%;}
        
        .tab-panel { display: none; animation: fadeIn 0.3s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; color: var(--text-sub); margin-bottom: 8px; margin-left: 6px; font-weight: 500;}
        .form-control, .form-select { 
            width: 100%; padding: 16px; background: var(--input-bg); 
            border: 1px solid rgba(150, 150, 150, 0.2); border-radius: 16px; 
            color: var(--text-main); box-sizing: border-box; font-size: 16px; outline: none; 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .form-control:focus, .form-select:focus { border-color: var(--blue-accent); }
        
        .btn { width: 100%; padding: 18px; border: none; border-radius: 16px; font-weight: 600; font-size: 16px; color: #fff; margin-top: 12px; cursor: pointer; transition: transform 0.2s; }
        .btn:active { transform: scale(0.96); }
        .btn-blue { background: var(--blue-accent); }
        .btn-green { background: var(--success-green); color: #fff; }
        .loader { text-align: center; padding: 40px; color: var(--text-sub); }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://i.postimg.cc/wvF7Hr48/chutoanfoto2026-logo-new.png" alt="ChuToan Foto Logo">
        <div style="font-size: 13px; color: var(--success-green); display: flex; align-items: center; font-weight: 600;">
            <span class="status-dot"></span> Đã kết nối
        </div>
    </div>

    <div class="container">
        <!-- LỊCH CHỤP -->
        <div class="section-title">LỊCH CHỤP</div>
        <div id="bookingList"><div class="loader">Đang tải dữ liệu...</div></div>

        <!-- THỐNG KÊ DOANH THU -->
        <div class="section-title" style="margin-top: 40px;">THỐNG KÊ DOANH THU</div>
        <div style="display: flex; gap: 12px; margin-bottom: 18px;">
            <select id="filterYear" class="form-select glass-panel" style="padding: 14px; font-size: 15px; flex: 1; border: 1px solid var(--glass-border); outline: none;" onchange="updateStatsUI()">
                <option value="ALL">Tất cả các năm</option>
            </select>
            <select id="filterMonth" class="form-select glass-panel" style="padding: 14px; font-size: 15px; flex: 1; border: 1px solid var(--glass-border); outline: none;" onchange="updateStatsUI()">
                <option value="ALL">Tổng cả năm</option>
                <option value="0">Tháng 1</option><option value="1">Tháng 2</option><option value="2">Tháng 3</option>
                <option value="3">Tháng 4</option><option value="4">Tháng 5</option><option value="5">Tháng 6</option>
                <option value="6">Tháng 7</option><option value="7">Tháng 8</option><option value="8">Tháng 9</option>
                <option value="9">Tháng 10</option><option value="10">Tháng 11</option><option value="11">Tháng 12</option>
            </select>
        </div>

        <div class="stats-grid">
            <div class="stat-card glass-panel">
                <div class="stat-label">Tổng Doanh Thu</div>
                <div class="stat-value gold" id="totalRevenue">0 đ</div>
            </div>
            <div class="stat-card glass-panel">
                <div class="stat-label">Đã Thu Thực Tế</div>
                <div class="stat-value green" id="totalCollected">0 đ</div>
            </div>
            <div class="stat-card glass-panel">
                <div class="stat-label">Chưa Thanh Toán</div>
                <div class="stat-value red" id="totalDebt">0 đ</div>
            </div>
            <div class="stat-card glass-panel">
                <div class="stat-label">Tổng số Job</div>
                <div class="stat-value" id="totalShows">0</div>
            </div>
        </div>
    </div>

    <!-- NÚT (+) -->
    <div class="fab" onclick="openModal()">+</div>

    <!-- MODAL FORM -->
    <div class="modal" id="modalForm">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Tạo Lịch Mới</h3>
                <span class="close-btn" onclick="closeModal()">✕</span>
            </div>
            
            <div id="tab-create" class="tab-panel active">
                <form id="formCreate" onsubmit="submitCreate(event)">
                    <div class="form-group"><label>Ngày chụp:</label><input type="date" id="c_ngay" class="form-control" required></div>
                    <div class="form-group"><label>Thời gian (Sáng/Chiều):</label><input type="text" id="c_thoigian" class="form-control" placeholder="Sáng"></div>
                    <div class="form-group"><label>Khách hàng (Tên):</label><input type="text" id="c_khach" class="form-control" required placeholder="Bắt buộc nhập đúng để dễ tìm"></div>
                    <div class="form-group"><label>Địa điểm chụp:</label><input type="text" id="c_diadiem" class="form-control"></div>
                    <div class="form-group"><label>Link Google Maps (Vị trí):</label><input type="url" id="c_linkmaps" class="form-control" placeholder="https://maps.app.goo.gl/..."></div>
                    <div class="form-group">
                        <label>Gói dịch vụ:</label>
                        <select id="c_noidung" class="form-select">
                            <option value="Phóng Sự Cưới">Phóng Sự Cưới</option>
                            <option value="Ăn Hỏi">Ăn Hỏi</option>
                            <option value="Chụp Studio">Chụp Studio</option>
                            <option value="Kỷ Yếu">Kỷ Yếu</option>
                            <option value="Sự Kiện">Sự Kiện</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Giá gói chụp (VNĐ):</label><input type="text" id="c_gia" class="form-control money-input" placeholder="1.500.000"></div>
                    <div class="form-group"><label>Phí đi lại (VNĐ):</label><input type="text" id="c_phi" class="form-control money-input" placeholder="0"></div>
                    <div class="form-group"><label>Tiền cọc (VNĐ):</label><input type="text" id="c_coc" class="form-control money-input" placeholder="0"></div>
                    <div class="form-group"><label>Ghi chú thêm:</label><input type="text" id="c_ghichu" class="form-control"></div>
                    <div class="form-group"><label>Thư mục PC:</label><input type="text" id="c_thumuc" class="form-control" placeholder="D:\DuLieuChup\"></div>
                    <button type="submit" class="btn btn-blue" id="btnCreate">⚡ TẠO LỊCH & ĐỒNG BỘ PRO</button>
                </form>
            </div>

            <div id="tab-edit" class="tab-panel">
                <form id="formEdit" onsubmit="submitEdit(event)">
                    <input type="hidden" id="e_rowindex">
                    <div class="form-group"><label>Link Ảnh Google Drive (Bàn giao):</label><input type="url" id="e_linkdrive" class="form-control" placeholder="https://drive.google.com/drive/..."></div>
                    <div class="form-group"><label>Link Google Maps:</label><input type="url" id="e_linkmaps" class="form-control" placeholder="https://maps.app.goo.gl/..."></div>
                    <div class="form-group"><label>Ghi chú thêm:</label><input type="text" id="e_ghichu" class="form-control"></div>
                    <button type="submit" class="btn btn-blue" id="btnEdit">💾 LƯU CẬP NHẬT</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyiFlBtGKqz0TbUSIraSrSP81aq0Uos3dLKdF5uzoyZTBGGeArOzQ3fjp8a551HGnm0/exec";

        let allValidData = [];
        let isFirstLoad = true;

        function formatMoney(num) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num); }
        function parseNum(val) { if (!val) return 0; return parseInt(val.toString().replace(/\./g, '').replace(/,/g, '').replace('đ', '').trim()) || 0; }

        function parseDateCustom(str) {
            if (!str) return null;
            str = str.toString().trim();
            if (/^\d{4}-\d{1,2}-\d{1,2}/.test(str)) {
                let parts = str.split('T')[0].split('-');
                return new Date(parts[0], parts[1] - 1, parts[2]);
            }
            if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(str)) {
                let parts = str.split('/');
                return new Date(parts[2], parts[1] - 1, parts[0]);
            }
            let d = new Date(str);
            return isNaN(d.getTime()) ? null : d;
        }

        function formatDateDisplay(d) {
            if (!d) return '--';
            let day = ("0" + d.getDate()).slice(-2);
            let month = ("0" + (d.getMonth() + 1)).slice(-2);
            let year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }

        async function loadData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderUI(data);
            } catch (e) { document.getElementById('bookingList').innerHTML = '<div class="loader" style="color:red">Lỗi tải dữ liệu.</div>'; }
        }

        function renderUI(data) {
            const list = document.getElementById('bookingList');
            list.innerHTML = '';
            
            if (data.length === 0) { list.innerHTML = '<div class="loader">Chưa có lịch chụp nào.</div>'; return; }

            let validData = data.filter(r => r['Khách hàng']);
            validData.forEach(r => { r._dateObj = parseDateCustom(r['Ngày chụp']); });
            validData.sort((a, b) => {
                if (!a._dateObj) return 1;
                if (!b._dateObj) return -1;
                return a._dateObj - b._dateObj;
            }); 
            
            allValidData = validData;

            let years = [...new Set(allValidData.map(r => r._dateObj ? r._dateObj.getFullYear() : null).filter(y => y !== null))].sort((a,b) => b-a);
            let yearSelect = document.getElementById('filterYear');
            let currentSelectedYear = yearSelect.value;
            yearSelect.innerHTML = `<option value="ALL">Tất cả các năm</option>`;
            years.forEach(y => { 
                let selected = (y.toString() === currentSelectedYear) ? 'selected' : '';
                yearSelect.insertAdjacentHTML('beforeend', `<option value="${y}" ${selected}>Năm ${y}</option>`); 
            });

            if (isFirstLoad) {
                const now = new Date();
                let currentY = now.getFullYear().toString();
                let currentM = now.getMonth().toString();

                if (years.includes(parseInt(currentY))) { 
                    yearSelect.value = currentY; 
                }
                document.getElementById('filterMonth').value = currentM;
                isFirstLoad = false;
            }

            let groupedData = {};
            validData.forEach(row => {
                let dObj = row._dateObj;
                let monthYear = dObj ? `Tháng ${dObj.getMonth() + 1} - ${dObj.getFullYear()}` : 'Lịch Chưa Xác Định';
                let displayDate = dObj ? formatDateDisplay(dObj) : (row['Ngày chụp'] || 'Không rõ ngày');
                
                if (!groupedData[monthYear]) groupedData[monthYear] = {};
                if (!groupedData[monthYear][displayDate]) groupedData[monthYear][displayDate] = [];
                groupedData[monthYear][displayDate].push(row);
            });

            let htmlStr = '';
            let mIndex = 0;
            
            for (let monthYear in groupedData) {
                htmlStr += `
                    <div class="month-header glass-panel" onclick="toggleSection('month-content-${mIndex}', this)">
                        <span>📅 ${monthYear}</span>
                        <span class="toggle-icon">▼</span>
                    </div>
                    <div class="month-content" id="month-content-${mIndex}">
                `;
                
                let dIndex = 0;
                for (let dateStr in groupedData[monthYear]) {
                    htmlStr += `
                        <div class="day-header glass-panel" onclick="toggleSection('day-content-${mIndex}-${dIndex}', this)">
                            <span>🗓️ ${dateStr}</span>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div class="day-content" id="day-content-${mIndex}-${dIndex}">
                    `;
                    
                    groupedData[monthYear][dateStr].forEach(row => {
                        let gia = parseNum(row['Giá gói']), phi = parseNum(row['Phí đi lại']);
                        let coc = parseNum(row['Cọc']), tt = parseNum(row['Thanh toán thêm']);
                        let conLai = parseNum(row['Còn lại']);
                        let rowIndex = row['_rowIndex'];

                        let moneyClass = conLai > 0 ? 'debt' : 'paid';
                        let moneyText = conLai > 0 ? `Cần thu: ${formatMoney(conLai)}` : 'Đã tất toán ✓';

                        let mapsBtn = row['Link Maps'] ? `<a href="${row['Link Maps']}" target="_blank" class="action-link-btn maps" onclick="event.stopPropagation()">📍 Maps</a>` : '';
                        let driveBtn = row['Link Drive'] ? `<a href="${row['Link Drive']}" target="_blank" class="action-link-btn drive" onclick="event.stopPropagation()">📁 Drive</a>` : '';

                        let paidBtnHTML = '';
                        if (conLai > 0) {
                            paidBtnHTML = `
                                <div style="margin-top: 16px; margin-bottom: 6px;" onclick="event.stopPropagation()">
                                    <button class="btn btn-green" style="padding: 14px; margin-top: 0; font-size: 15px; width: 100%; border-radius: 14px;" onclick="markPaid(${rowIndex}, '${row['Khách hàng']}')">
                                        Đã Thanh Toán
                                    </button>
                                </div>
                            `;
                        }

                        htmlStr += `
                            <div class="card glass-panel" onclick="toggleSection('expanded-${rowIndex}', this, true)">
                                <div class="card-header">
                                    <div><h2 class="client-name">${row['Khách hàng']}</h2><p class="package-name">${row['Nội dung'] || 'Chưa ghi'}</p></div>
                                    <div class="shoot-time">${row['Thời gian'] || '--'}</div>
                                </div>
                                <div class="details-row"><span class="details-label">Địa điểm:</span><span>${row['Địa điểm'] || '--'}</span></div>
                                <div class="money-status ${moneyClass}">
                                    <span>Tổng: ${formatMoney(gia + phi)}</span>
                                    <span>${moneyText}</span>
                                </div>

                                <div class="card-expanded-content" id="expanded-${rowIndex}">
                                    <div class="details-row"><span class="details-label">Phí đi lại:</span><span>${formatMoney(phi)}</span></div>
                                    <div class="details-row"><span class="details-label">Tiền cọc:</span><span>${formatMoney(coc)}</span></div>
                                    <div class="details-row"><span class="details-label">Đã trả thêm:</span><span>${formatMoney(tt)}</span></div>
                                    ${row['Thư mục PC'] ? `<div class="details-row"><span class="details-label">Thư mục PC:</span><span>${row['Thư mục PC']}</span></div>` : ''}
                                    ${row['Ghi chú'] ? `<div class="details-row"><span class="details-label">Ghi chú:</span><span>${row['Ghi chú']}</span></div>` : ''}
                                    
                                    <div style="margin-top: 12px;">
                                        ${mapsBtn}
                                        ${driveBtn}
                                    </div>

                                    ${paidBtnHTML}

                                    <div class="card-btns-row" onclick="event.stopPropagation()">
                                        <button class="btn-card-action btn-edit" onclick="openEditModal(${rowIndex}, '${row['Khách hàng']}')">✏️ Sửa Lịch</button>
                                        <button class="btn-card-action btn-delete" onclick="deleteBooking(${rowIndex}, '${row['Khách hàng']}')">🗑️ Xóa Lịch</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    
                    htmlStr += `</div>`;
                    dIndex++;
                }
                htmlStr += `</div>`;
                mIndex++;
            }
            
            list.innerHTML = htmlStr;
            updateStatsUI();
        }

        function toggleSection(id, headerEl, isCard = false) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.toggle('show');
                if (!isCard) {
                    const icon = headerEl.querySelector('.toggle-icon');
                    icon.style.transform = el.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
                }
            }
        }

        function updateStatsUI() {
            let fYear = document.getElementById('filterYear').value;
            let fMonth = document.getElementById('filterMonth').value;
            let tRev = 0, tPaid = 0, tDebt = 0, tShows = 0;

            allValidData.forEach(row => {
                let dObj = row._dateObj;
                let matchY = true, matchM = true;
                if (fYear !== "ALL") { if (!dObj || dObj.getFullYear().toString() !== fYear) matchY = false; }
                if (fMonth !== "ALL") { if (!dObj || dObj.getMonth().toString() !== fMonth) matchM = false; }

                if (matchY && matchM) {
                    let gia = parseNum(row['Giá gói']), phi = parseNum(row['Phí đi lại']);
                    let coc = parseNum(row['Cọc']), tt = parseNum(row['Thanh toán thêm']);
                    tRev += (gia + phi); tPaid += (coc + tt); tDebt += parseNum(row['Còn lại']); tShows++;
                }
            });

            document.getElementById('totalRevenue').innerText = formatMoney(tRev);
            document.getElementById('totalCollected').innerText = formatMoney(tPaid);
            document.getElementById('totalDebt').innerText = formatMoney(tDebt);
            document.getElementById('totalShows').innerText = tShows;
        }
        
        loadData(); 

        function openModal() {
            document.getElementById('modalTitle').innerText = "Tạo Lịch Mới";
            document.getElementById('tab-create').classList.add('active');
            document.getElementById('tab-edit').classList.remove('active');
            document.getElementById('modalForm').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modalForm').style.display = 'none'; }

        function openEditModal(rowIndex, name) {
            const item = allValidData.find(r => r._rowIndex === rowIndex);
            if (!item) return;
            document.getElementById('modalTitle').innerText = `Sửa Lịch: ${name}`;
            document.getElementById('e_rowindex').value = rowIndex;
            document.getElementById('e_linkdrive').value = item['Link Drive'] || '';
            document.getElementById('e_linkmaps').value = item['Link Maps'] || '';
            document.getElementById('e_ghichu').value = item['Ghi chú'] || '';
            
            document.getElementById('tab-create').classList.remove('active');
            document.getElementById('tab-edit').classList.add('active');
            document.getElementById('modalForm').style.display = 'flex';
        }

        document.querySelectorAll('.money-input').forEach(input => {
            input.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\./g, '').replace(/\D/g, '');
                if (value !== '') { e.target.value = new Intl.NumberFormat('vi-VN').format(value).replace(/,/g, '.'); } 
                else { e.target.value = ''; }
            });
        });

        async function markPaid(rowIndex, name) {
            if (!confirm(`Xác nhận khách hàng "${name}" đã thanh toán toàn bộ số tiền còn lại?`)) return;
            try {
                let btn = event.target;
                btn.innerText = "Đang đồng bộ..."; btn.disabled = true;
                await fetch(API_URL, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "MARK_PAID", rowIndex: rowIndex })
                });
                setTimeout(loadData, 1500);
            } catch (err) { alert("Lỗi kết nối!"); }
        }

        async function submitCreate(e) {
            e.preventDefault();
            const btn = document.getElementById('btnCreate');
            btn.innerText = "Đang đồng bộ..."; btn.style.opacity = 0.7; btn.disabled = true;
            const payload = {
                action: "CREATE",
                ngayChup: document.getElementById('c_ngay').value, thoiGian: document.getElementById('c_thoigian').value,
                khachHang: document.getElementById('c_khach').value, diaDiem: document.getElementById('c_diadiem').value,
                linkMaps: document.getElementById('c_linkmaps').value, noiDung: document.getElementById('c_noidung').value,
                giaGoi: parseNum(document.getElementById('c_gia').value), phiDiLai: parseNum(document.getElementById('c_phi').value),
                coc: parseNum(document.getElementById('c_coc').value), ghiChu: document.getElementById('c_ghichu').value,
                thuMucPC: document.getElementById('c_thumuc').value
            };
            await sendData(payload, btn, "⚡ TẠO LỊCH & ĐỒNG BỘ PRO");
            document.getElementById('formCreate').reset();
        }

        async function submitEdit(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEdit');
            btn.innerText = "Đang lưu..."; btn.style.opacity = 0.7; btn.disabled = true;
            const payload = {
                action: "EDIT_ROW", rowIndex: document.getElementById('e_rowindex').value,
                linkDrive: document.getElementById('e_linkdrive').value, linkMaps: document.getElementById('e_linkmaps').value,
                ghiChu: document.getElementById('e_ghichu').value
            };
            await sendData(payload, btn, "💾 LƯU CẬP NHẬT");
        }

        async function deleteBooking(rowIndex, name) {
            if (!confirm(`Bạn có chắc chắn muốn XÓA lịch của khách "${name}" không? Thao tác này không thể hoàn tác.`)) return;
            try {
                await fetch(API_URL, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "DELETE_ROW", rowIndex: rowIndex })
                });
                setTimeout(loadData, 1500);
            } catch (err) { alert("Lỗi khi xóa lịch!"); }
        }

        async function sendData(payload, btn, originalText) {
            try {
                await fetch(API_URL, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                closeModal(); setTimeout(loadData, 1500); 
            } catch (err) { alert("Lỗi khi lưu dữ liệu!"); } 
            finally { btn.innerText = originalText; btn.style.opacity = 1; btn.disabled = false; }
        }
    </script>
</body>
</html>
