<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChuToan Foto | Quản Lý Lịch Chụp</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* BẢNG MÀU & BIẾN TOÀN CỤC - CHUẨN IOS */
    :root {
      --primary-gold: #c49a45;
      --primary-gold-hover: #a88741;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.4);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      --text-dark: #1d1d1f;
      --text-gray: #86868b;
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-dark);
      min-height: 100vh;
      padding-bottom: 100px;
    }

    /* HIỆU ỨNG KÍNH LỎNG (LIQUID GLASS) DÀNH CHO CÁC KHỐI */
    .liquid-glass {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--glass-shadow);
    }

    /* HEADER & ĐIỀU HƯỚNG */
    .header-container {
      margin: 20px auto;
      width: 95%;
      max-width: 1200px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }
    .brand h1 { font-size: 24px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .brand span { font-size: 11px; letter-spacing: 4px; color: var(--text-gray); }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 15px 20px 15px 45px;
      border: none;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.5);
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
    }
    .search-box input:focus { background: rgba(255, 255, 255, 0.8); box-shadow: 0 0 0 2px var(--primary-gold); }
    .search-box i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary-gold);
    }

    /* MENU NÚT */
    .menu-bar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    .menu-bar::-webkit-scrollbar { display: none; }
    
    .menu-btn {
      flex: 1;
      min-width: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px 10px;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }
    .menu-btn:active { transform: scale(0.95); }
    .menu-btn i { font-size: 22px; color: var(--primary-gold); }
    .menu-btn span { font-size: 11px; font-weight: 600; color: var(--text-dark); text-transform: uppercase; white-space: nowrap; }

    /* DANH SÁCH LỊCH (CARDS) */
    .content-container {
      width: 95%;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      padding-bottom: 12px;
    }
    .client-name { font-size: 18px; font-weight: 700; color: var(--primary-gold); }
    .package-name { font-size: 13px; color: var(--text-gray); font-weight: 500; margin-top: 4px; }
    
    .badge {
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.unpaid { background: rgba(255, 59, 48, 0.1); color: #ff3b30; }
    .badge.paid { background: rgba(52, 199, 89, 0.1); color: #34c759; }

    .card-info { font-size: 14px; line-height: 1.6; display: flex; flex-direction: column; gap: 8px; }
    .card-info div { display: flex; align-items: flex-start; gap: 10px; }
    .card-info i { margin-top: 4px; color: var(--text-gray); width: 16px; text-align: center; }
    
    .financial {
      background: rgba(255, 255, 255, 0.4);
      padding: 12px;
      border-radius: 12px;
      margin-top: 10px;
    }
    .financial p { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
    .financial .total { font-weight: 700; font-size: 15px; color: var(--text-dark); margin-top: 8px; border-top: 1px dashed rgba(0,0,0,0.1); padding-top: 8px;}

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
      padding-top: 15px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-edit { background: rgba(255, 255, 255, 0.8); color: var(--text-dark); }
    .btn-delete { background: rgba(255, 59, 48, 0.1); color: #ff3b30; }
    .btn-pay { background: var(--primary-gold); color: white; }
    .btn:active { transform: scale(0.95); }

    /* NÚT NỔI (+) DƯỚI GÓC PHẢI - CHUẨN IOS */
    .floating-fab {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 65px;
      height: 65px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-gold);
      font-size: 28px;
      box-shadow: 0 10px 25px rgba(196, 154, 69, 0.3);
      cursor: pointer;
      z-index: 1000;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .floating-fab:active { transform: scale(0.9); box-shadow: 0 5px 15px rgba(196, 154, 69, 0.2); }

    /* MODAL FORM KÍNH MỜ */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active { display: flex; opacity: 1; }
    
    .modal-content {
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 30px;
      background: rgba(255,255,255,0.85);
      transform: translateY(30px);
      transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .modal-content::-webkit-scrollbar { width: 5px; }
    .modal-content::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h2 { font-size: 20px; color: var(--primary-gold); }
    .close-btn { background: none; border: none; font-size: 24px; color: var(--text-gray); cursor: pointer; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-dark); }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      background: rgba(255,255,255,0.5);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--primary-gold); background: #fff; }
    .form-submit-btn {
      width: 100%;
      padding: 15px;
      background: var(--primary-gold);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(196, 154, 69, 0.4);
    }
    .form-submit-btn:active { transform: scale(0.98); }

    /* LOADING SPINNER */
    .loader-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.7); backdrop-filter: blur(10px);
      display: none; justify-content: center; align-items: center; z-index: 9999;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(196, 154, 69, 0.3);
      border-radius: 50%;
      border-top-color: var(--primary-gold);
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .floating-fab { bottom: 20px; right: 20px; width: 55px; height: 55px; font-size: 24px; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- LOADING OVERLAY -->
  <div class="loader-container" id="loader"><div class="spinner"></div></div>

  <!-- HEADER GIAO DIỆN KÍNH -->
  <div class="header-container liquid-glass">
    <div class="top-bar">
      <div class="brand">
        <h1>CHUTOAN</h1>
        <span>FOTOGRAPHY</span>
      </div>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Tìm tên khách hàng..." onkeyup="filterData()">
      </div>
    </div>
    
    <div class="menu-bar">
      <!-- ĐÃ THAY NÚT TẠO LỊCH THÀNH XEM LỊCH ĐỒNG BỘ APPLE CALENDAR -->
      <div class="menu-btn liquid-glass" onclick="openCalendarApp()">
        <i class="far fa-calendar-alt"></i>
        <span>Xem Lịch</span>
      </div>
      <div class="menu-btn liquid-glass" onclick="alert('Chức năng Lịch Ẩn')">
        <i class="far fa-eye-slash"></i>
        <span>Lịch Ẩn</span>
      </div>
      <div class="menu-btn liquid-glass" onclick="alert('Chức năng Thống Kê')">
        <i class="fas fa-chart-bar"></i>
        <span>Thống Kê</span>
      </div>
      <div class="menu-btn liquid-glass" onclick="window.open('https://docs.google.com/spreadsheets/d/ID_TRANG_TINH_CUA_BAN', '_blank')">
        <i class="fas fa-table"></i>
        <span>Sheet</span>
      </div>
      <div class="menu-btn liquid-glass" onclick="loadData()">
        <i class="fas fa-sync-alt"></i>
        <span>Làm Mới</span>
      </div>
    </div>
  </div>

  <!-- DANH SÁCH LỊCH -->
  <div class="content-container" id="danhSachLich">
    <!-- Dữ liệu sẽ đổ vào đây bằng JS -->
  </div>

  <!-- NÚT NỔI TẠO LỊCH (FLOATING BUTTON) -->
  <div class="floating-fab" onclick="openForm()">
    <i class="fas fa-plus"></i>
  </div>

  <!-- MODAL FORM NHẬP LIỆU -->
  <div class="modal-overlay" id="formModal">
    <div class="modal-content liquid-glass">
      <div class="modal-header">
        <h2 id="modalTitle">Tạo Lịch Mới</h2>
        <button class="close-btn" onclick="closeForm()"><i class="fas fa-times"></i></button>
      </div>
      <form id="bookingForm" onsubmit="submitForm(event)">
        <input type="hidden" id="rowIndex" name="rowIndex">
        
        <div class="form-group"><label>Khách hàng *</label><input type="text" id="khachHang" name="khachHang" required></div>
        <div class="form-group"><label>Số điện thoại</label><input type="text" id="sdt" name="sdt"></div>
        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1"><label>Ngày chụp *</label><input type="date" id="ngayChup" name="ngayChup" required></div>
          <div class="form-group" style="flex:1"><label>Khung giờ</label><input type="text" id="thoiGian" name="thoiGian" placeholder="VD: Sáng 7h"></div>
        </div>
        <div class="form-group"><label>Gói dịch vụ</label><input type="text" id="noiDung" name="noiDung" placeholder="VD: Phóng sự cưới"></div>
        <div class="form-group"><label>Địa điểm</label><input type="text" id="diaDiem" name="diaDiem"></div>
        
        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1"><label>Giá gói (VND)</label><input type="number" id="giaGoi" name="giaGoi"></div>
          <div class="form-group" style="flex:1"><label>Phí đi lại (VND)</label><input type="number" id="phiDiLai" name="phiDiLai"></div>
          <div class="form-group" style="flex:1"><label>Đã cọc (VND)</label><input type="number" id="coc" name="coc"></div>
        </div>

        <div class="form-group"><label>Ghi chú / Timeline</label><textarea id="ghiChu" name="ghiChu" rows="2"></textarea></div>
        
        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1"><label>Link Zalo</label><input type="text" id="zalo" name="zalo"></div>
          <div class="form-group" style="flex:1"><label>Link Facebook</label><input type="text" id="linkFacebook" name="linkFacebook"></div>
        </div>
        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1"><label>Link Maps</label><input type="text" id="linkMaps" name="linkMaps"></div>
          <div class="form-group" style="flex:1"><label>Link Drive Trả Ảnh</label><input type="text" id="linkDrive" name="linkDrive"></div>
        </div>

        <button type="submit" class="form-submit-btn">LƯU THÔNG TIN</button>
      </form>
    </div>
  </div>

  <script>
    // ==========================================
    // DÁN LINK GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY
    // ==========================================
    const WEB_APP_URL = "DÁN_LINK_WEB_APP_CỦA_BẠN_VÀO_ĐÂY";
    let globalData = [];

    // MỞ ỨNG DỤNG LỊCH IPHONE HOẶC GOOGLE CALENDAR
    function openCalendarApp() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) { window.location.href = "calshow://"; } 
      else { window.open("https://calendar.google.com/calendar/r", "_blank"); }
    }

    // ĐỊNH DẠNG TIỀN TỆ
    function formatTien(tien) {
      if (!tien || isNaN(tien)) return "0 đ";
      return Number(tien).toLocaleString('vi-VN') + " đ";
    }

    // TẢI DỮ LIỆU TỪ GOOGLE SHEET
    async function loadData() {
      showLoading(true);
      try {
        const response = await fetch(WEB_APP_URL);
        const data = await response.json();
        globalData = data.reverse(); // Đảo ngược để lịch mới nhất lên đầu
        renderCards(globalData);
      } catch (error) {
        alert("Lỗi tải dữ liệu. Vui lòng kiểm tra lại mạng hoặc Link Web App.");
      }
      showLoading(false);
    }

    // HIỂN THỊ DANH SÁCH LỊCH RA GIAO DIỆN
    function renderCards(dataArray) {
      const container = document.getElementById("danhSachLich");
      container.innerHTML = "";
      
      if(dataArray.length === 0) {
        container.innerHTML = "<p style='text-align:center; width:100%; color:#86868b;'>Không tìm thấy lịch nào.</p>";
        return;
      }

      dataArray.forEach(item => {
        const gia = Number(item["Giá gói"] || 0);
        const phi = Number(item["Phí đi lại"] || 0);
        const coc = Number(item["Cọc"] || 0);
        const tongThu = gia + phi;
        const conLai = Number(item["Còn lại"] || (tongThu - coc));
        
        const isPaid = conLai <= 0;
        const badgeClass = isPaid ? "paid" : "unpaid";
        const badgeText = isPaid ? "Đã Tất Toán" : "Chưa Thu Đủ";

        // Tạo thẻ giao diện Kính lỏng
        const card = document.createElement("div");
        card.className = "card liquid-glass";
        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="client-name">${item["Khách hàng"]}</div>
              <div class="package-name">${item["Gói dịch vụ"] || "Chưa có gói"}</div>
            </div>
            <div class="badge ${badgeClass}">${badgeText}</div>
          </div>
          
          <div class="card-info">
            <div><i class="far fa-calendar-alt"></i><span>${item["Ngày chụp"]} • ${item["Giờ"] || "Cả ngày"}</span></div>
            <div><i class="fas fa-map-marker-alt"></i><span>${item["Địa điểm"] || "Chưa cập nhật"}</span></div>
            <div><i class="fas fa-phone-alt"></i><span>${item["SĐT"] || "Chưa cập nhật"}</span></div>
          </div>
          
          <div class="financial">
            <p><span>Tổng dịch vụ:</span> <span>${formatTien(tongThu)}</span></p>
            <p><span>Đã cọc:</span> <span>${formatTien(coc)}</span></p>
            <p class="total"><span>Cần thu:</span> <span style="color:${isPaid ? '#34c759' : '#ff3b30'}">${formatTien(conLai)}</span></p>
          </div>
          
          <div class="card-actions">
            <button class="btn btn-edit" onclick='editRow(${JSON.stringify(item).replace(/'/g, "&#39;")})'><i class="fas fa-pen"></i> Sửa</button>
            ${!isPaid ? `<button class="btn btn-pay" onclick="markPaid(${item._rowIndex})"><i class="fas fa-check-circle"></i> Xong</button>` : ''}
            <button class="btn btn-delete" onclick="deleteRow(${item._rowIndex}, '${item["Khách hàng"]}')"><i class="fas fa-trash"></i> Xóa</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // TÌM KIẾM
    function filterData() {
      const keyword = document.getElementById("searchInput").value.toLowerCase();
      const filtered = globalData.filter(item => 
        (item["Khách hàng"] && item["Khách hàng"].toLowerCase().includes(keyword)) ||
        (item["SĐT"] && item["SĐT"].toLowerCase().includes(keyword))
      );
      renderCards(filtered);
    }

    // QUẢN LÝ MODAL FORM
    function openForm() {
      document.getElementById("bookingForm").reset();
      document.getElementById("rowIndex").value = "";
      document.getElementById("modalTitle").innerText = "Tạo Lịch Mới";
      
      const p = String(new Date().toLocaleDateString('vi-VN')).split('/');
      if(p.length === 3) document.getElementById("ngayChup").value = p[2] + "-" + p[1].padStart(2,'0') + "-" + p[0].padStart(2,'0');
      
      document.getElementById("formModal").classList.add("active");
    }

    function closeForm() {
      document.getElementById("formModal").classList.remove("active");
    }

    // NẠP DỮ LIỆU ĐỂ SỬA
    function editRow(item) {
      document.getElementById("rowIndex").value = item._rowIndex;
      document.getElementById("modalTitle").innerText = "Sửa Lịch Chụp";
      document.getElementById("khachHang").value = item["Khách hàng"] || "";
      document.getElementById("sdt").value = item["SĐT"] || "";
      
      let dateVal = item["Ngày chụp"] || "";
      if (dateVal.includes("/")) {
        let p = dateVal.split("/");
        dateVal = p[2] + "-" + p[1].padStart(2, '0') + "-" + p[0].padStart(2, '0');
      } else if(dateVal.includes("T")) {
        dateVal = dateVal.split("T")[0];
      }
      document.getElementById("ngayChup").value = dateVal;
      
      document.getElementById("thoiGian").value = item["Giờ"] || "";
      document.getElementById("noiDung").value = item["Gói dịch vụ"] || "";
      document.getElementById("diaDiem").value = item["Địa điểm"] || "";
      document.getElementById("giaGoi").value = item["Giá gói"] || "";
      document.getElementById("phiDiLai").value = item["Phí đi lại"] || "";
      document.getElementById("coc").value = item["Cọc"] || "";
      document.getElementById("ghiChu").value = item["Ghi chú"] || "";
      document.getElementById("zalo").value = item["Link Zalo"] || "";
      document.getElementById("linkFacebook").value = item["Link Facebook"] || "";
      document.getElementById("linkMaps").value = item["Link Maps"] || "";
      document.getElementById("linkDrive").value = item["Link Drive"] || "";

      document.getElementById("formModal").classList.add("active");
    }

    // GỬI DỮ LIỆU (CREATE VÀ EDIT)
    async function submitForm(e) {
      e.preventDefault();
      showLoading(true);
      
      const payload = {
        action: document.getElementById("rowIndex").value ? "EDIT_ROW" : "CREATE",
        rowIndex: document.getElementById("rowIndex").value,
        khachHang: document.getElementById("khachHang").value,
        sdt: document.getElementById("sdt").value,
        ngayChup: document.getElementById("ngayChup").value,
        thoiGian: document.getElementById("thoiGian").value,
        noiDung: document.getElementById("noiDung").value,
        diaDiem: document.getElementById("diaDiem").value,
        giaGoi: document.getElementById("giaGoi").value,
        phiDiLai: document.getElementById("phiDiLai").value,
        coc: document.getElementById("coc").value,
        ghiChu: document.getElementById("ghiChu").value,
        zalo: document.getElementById("zalo").value,
        linkFacebook: document.getElementById("linkFacebook").value,
        linkMaps: document.getElementById("linkMaps").value,
        linkDrive: document.getElementById("linkDrive").value
      };

      try {
        await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) });
        closeForm();
        await loadData();
      } catch(err) {
        alert("Có lỗi xảy ra khi lưu dữ liệu.");
      }
      showLoading(false);
    }

    // XÓA LỊCH
    async function deleteRow(rowIndex, khName) {
      if(!confirm("Bạn có chắc chắn muốn xóa lịch của khách: " + khName + "?")) return;
      showLoading(true);
      try {
        await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "DELETE_ROW", rowIndex: rowIndex, khachHang: khName }) });
        await loadData();
      } catch(err) { alert("Lỗi khi xóa!"); }
      showLoading(false);
    }

    // TẤT TOÁN
    async function markPaid(rowIndex) {
      if(!confirm("Xác nhận khách đã thanh toán đủ tiền?")) return;
      showLoading(true);
      try {
        await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "MARK_PAID", rowIndex: rowIndex }) });
        await loadData();
      } catch(err) { alert("Lỗi khi tất toán!"); }
      showLoading(false);
    }

    // LOADER
    function showLoading(show) {
      document.getElementById("loader").style.display = show ? "flex" : "none";
    }

    // Tự động tải dữ liệu khi mở web
    window.onload = loadData;
  </script>
</body>
</html>
