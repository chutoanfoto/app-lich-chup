<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f1f3f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lịch Chụp">
    
    <link rel="apple-touch-icon" href="https://i.postimg.cc/wvF7Hr48/chutoanfoto2026-logo-new.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.postimg.cc/wvF7Hr48/chutoanfoto2026-logo-new.png">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/wvF7Hr48/chutoanfoto2026-logo-new.png">
    <link rel="shortcut icon" href="https://i.postimg.cc/wvF7Hr48/chutoanfoto2026-logo-new.png">

    <title>ChuToan Foto - Quản Lý Lịch Chụp</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg-base: #f1f3f6;
            --bg-mesh: radial-gradient(circle at 10% 20%, rgba(10, 132, 255, 0.12), transparent 50%), radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.1), transparent 50%), radial-gradient(circle at 50% 90%, rgba(255, 59, 48, 0.08), transparent 50%);
            --card-bg: rgba(255, 255, 255, 0.5); 
            --card-border: rgba(255, 255, 255, 0.8);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.05), inset 0 1px 2px rgba(255, 255, 255, 1);
            
            --text-main: #000000; --text-muted: #6b7280; --text-sub: #8e8e93;
            --accent-primary: #007aff; --accent-gold: #c59b27;
            --tag-gold-bg: rgba(197, 155, 39, 0.15); --tag-gold-text: #92400e;
            --alert-red: #ff3b30; --alert-bg: rgba(255, 59, 48, 0.12);
            --success-green: #34c759; --success-bg: rgba(52, 199, 89, 0.15);
            
            --modal-bg: rgba(242, 242, 247, 0.98); 
            --input-bg: #ffffff; 
            --input-border: rgba(0, 0, 0, 0.1);
            --input-text: #000000;
            --input-placeholder: #8e8e93;
            
            --btn-secondary-bg: rgba(118, 118, 128, 0.12); --btn-secondary-text: #1c1c1e;
            --divider-line: rgba(0, 0, 0, 0.06);
            --header-bg: rgba(255, 255, 255, 0.6); 
            --logo-filter: invert(1); --radius-card: 22px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-base: #000000;
                --bg-mesh: radial-gradient(circle at 10% 20%, rgba(10, 132, 255, 0.15), transparent 50%), radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.12), transparent 50%), radial-gradient(circle at 50% 90%, rgba(255, 55, 95, 0.1), transparent 50%);
                --card-bg: rgba(30, 30, 32, 0.45); 
                --card-border: rgba(255, 255, 255, 0.1);
                --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
                
                --text-main: #ffffff; --text-muted: #9ba1a6; --text-sub: rgba(235, 235, 245, 0.6);
                --accent-primary: #0a84ff; --accent-gold: #ffd60a;
                --tag-gold-bg: rgba(255, 214, 10, 0.15); --tag-gold-text: #fbbf24;
                --alert-red: #ff453a; --alert-bg: rgba(255, 69, 58, 0.15);
                --success-green: #30d158; --success-bg: rgba(48, 209, 88, 0.15);
                
                --modal-bg: rgba(28, 28, 30, 0.98); 
                --input-bg: #2c2c2e; 
                --input-border: rgba(255, 255, 255, 0.1);
                --input-text: #ffffff;
                --input-placeholder: #98989d;
                
                --btn-secondary-bg: rgba(255, 255, 255, 0.1); --btn-secondary-text: #e2e8f0;
                --divider-line: rgba(255, 255, 255, 0.08);
                --header-bg: rgba(20, 20, 22, 0.6); 
                --logo-filter: none;
            }
        }

        html, body { margin: 0; padding: 0; width: 100vw; max-width: 100%; overflow-x: hidden; overscroll-behavior-x: none; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; background-color: var(--bg-base); background-image: var(--bg-mesh); background-attachment: fixed; color: var(--text-main); min-height: 100vh; -webkit-tap-highlight-color: transparent; }
        body.modal-open { overflow: hidden; position: fixed; width: 100%; height: 100%; }
        .glass-fx { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(25px) saturate(200%); -webkit-backdrop-filter: blur(25px) saturate(200%); box-shadow: var(--card-shadow); }

        .header { width: 100%; padding: 14px 20px; position: sticky; top: 0; z-index: 50; background: var(--header-bg); backdrop-filter: blur(35px) saturate(200%); -webkit-backdrop-filter: blur(35px) saturate(200%); border-bottom: 1px solid var(--divider-line); display: flex; justify-content: space-between; align-items: center; }
        .header img { height: 30px; object-fit: contain; filter: var(--logo-filter); }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; background: var(--success-bg); color: var(--success-green); font-size: 12px; font-weight: 600; }
        .status-dot { width: 7px; height: 7px; background: var(--success-green); border-radius: 50%; }

        .container { width: 100%; padding: 16px; max-width: 580px; margin: 0 auto; padding-bottom: 110px; }
        .section-title { font-size: 12px; font-weight: 800; color: var(--text-muted); letter-spacing: 1.2px; margin-bottom: 12px; text-transform: uppercase; margin-left: 4px; }

        .calendar-swipe-header { text-align: center; margin-bottom: 16px; padding-top: 10px; cursor: pointer; user-select: none; }
        .calendar-title-text { font-size: 13.5px; font-weight: 800; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; }

        .year-block, .month-block, .day-block { transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease, margin 0.3s ease; max-height: 5000px; opacity: 1; overflow: hidden; transform-origin: top; }
        .hidden-step { max-height: 0 !important; opacity: 0 !important; margin-top: 0 !important; margin-bottom: 0 !important; pointer-events: none; border: none !important; }

        .year-header { padding: 16px 20px; margin: 20px 0 12px 0; border-radius: 20px; background: linear-gradient(135deg, var(--accent-primary), #005bb5); color: #ffffff; font-weight: 800; font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 24px rgba(0, 122, 255, 0.3); text-transform: uppercase; letter-spacing: 1px;}
        .year-content { display: none; } .year-content.show { display: block; animation: fadeIn 0.3s ease; }

        .month-header { padding: 14px 18px; margin: 12px 0 8px 8px; border-radius: 18px; border-left: 4px solid var(--accent-gold); color: var(--accent-gold); font-weight: 700; font-size: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .month-content { display: none; } .month-content.show { display: block; animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }

        .day-header { padding: 12px 16px; margin: 8px 0 8px 16px; border-radius: 16px; border-left: 3px solid var(--accent-primary); color: var(--accent-primary); font-weight: 700; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .day-content { display: none; } .day-content.show { display: block; animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        .toggle-icon { transition: transform 0.25s ease; font-size: 11px; opacity: 0.8; }

        .session-divider { display: flex; align-items: center; margin: 16px 0 10px 24px; font-size: 11.5px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .session-divider::after { content: ''; flex: 1; height: 1px; background: var(--divider-line); margin-left: 12px; border-radius: 2px; }

        .card { border-radius: var(--radius-card); padding: 18px; margin: 0 0 12px 24px; cursor: pointer; transition: transform 0.15s ease; }
        .card:active { transform: scale(0.985); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        
        .client-name-container { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
        .client-name { font-size: 17px; font-weight: 700; color: var(--text-main); margin: 0; letter-spacing: -0.2px; }
        .social-links-row { display: flex; align-items: center; gap: 6px; }
        .social-icon { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; transition: opacity 0.2s; }
        .social-icon:active { opacity: 0.5; }

        .tag-package { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--tag-gold-bg); color: var(--tag-gold-text); }
        .tag-session { font-size: 12px; font-weight: 600; background: var(--btn-secondary-bg); color: var(--text-main); padding: 5px 10px; border-radius: 8px; border: 1px solid var(--divider-line); }

        .location-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13.5px; color: var(--text-muted); margin-bottom: 12px; }
        .location-label { font-weight: 500; flex-shrink: 0; } .location-value { color: var(--text-main); font-weight: 500; }

        .action-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .action-link-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
        .action-link-btn.maps { background: rgba(2, 132, 199, 0.15); color: #0284c7; }
        .action-link-btn.drive { background: rgba(22, 163, 74, 0.15); color: #16a34a; }
        @media (prefers-color-scheme: dark) {
            .action-link-btn.maps { background: rgba(2, 132, 199, 0.25); color: #38bdf8; border-color: rgba(56, 189, 248, 0.2); }
            .action-link-btn.drive { background: rgba(22, 163, 74, 0.25); color: #4ade80; border-color: rgba(74, 222, 128, 0.2); }
        }

        .money-bar { background: var(--btn-secondary-bg); border-radius: 12px; border: 1px solid var(--divider-line); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; }
        .money-bar .total { font-weight: 600; color: var(--text-muted); } .money-bar .total-num { color: var(--text-main); font-weight: 700; }
        .money-bar .debt { color: var(--alert-red); font-weight: 700; } .money-bar .paid { color: var(--success-green); font-weight: 700; }

        .card-expanded-content { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--divider-line); }
        .card-expanded-content.show { display: block; animation: fadeIn 0.2s ease; }
        .detail-item { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: var(--text-muted); } .detail-item span:last-child { font-weight: 600; color: var(--text-main); }
        
        .detail-note { margin-top: 10px; padding: 12px; background: var(--btn-secondary-bg); border-radius: 12px; border: 1px solid var(--divider-line); }
        .detail-note-label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; text-transform: uppercase; letter-spacing: 0.5px;}
        .detail-note-content { font-size: 13.5px; font-weight: 500; color: var(--text-main); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }

        .card-btns-row { display: flex; gap: 8px; margin-top: 14px; }
        .btn-card-action { flex: 1; padding: 11px 0; border: none; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--divider-line); }
        .btn-edit { background: var(--btn-secondary-bg); color: var(--text-main); } .btn-delete { background: var(--alert-bg); color: var(--alert-red); border-color: transparent;}

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { border-radius: 18px; padding: 14px 16px; }
        .stat-label { font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
        .stat-value.gold { color: var(--accent-gold); } .stat-value.green { color: var(--success-green); } .stat-value.red { color: var(--alert-red); }

        .select-filter { width: 100%; padding: 12px 14px; border-radius: 14px; color: var(--text-main); font-size: 14px; font-weight: 600; outline: none; }

        .fab { position: fixed; bottom: 28px; right: 20px; width: 56px; height: 56px; background: var(--accent-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 28px; font-weight: 300; box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4); cursor: pointer; z-index: 80; }
        .fab:active { transform: scale(0.92); }

        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); justify-content: center; align-items: flex-end; overscroll-behavior: contain; width: 100vw; }
        .modal-content { background: var(--modal-bg); border-top: 1px solid var(--card-border); backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%); border-radius: 28px 28px 0 0; width: 100%; max-width: 580px; max-height: 88vh; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 24px 20px 36px 20px; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } } @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; } 
        .modal-header h3 { margin: 0; font-size: 20px; color: var(--text-main); font-weight: 700; letter-spacing: -0.3px;} 
        .close-btn { font-size: 18px; color: var(--text-muted); cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--btn-secondary-bg); border-radius: 50%; }
        
        .tab-panel { display: none; } .tab-panel.active { display: block; }
        .form-group { margin-bottom: 14px; display: flex; flex-direction: column; width: 100%; } 
        .form-group label { font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; margin-left: 4px; font-weight: 600;} 
        
        .form-control, .form-select { width: 100%; padding: 15px 14px; background: var(--input-bg) !important; border: 1px solid var(--input-border) !important; border-radius: 12px; color: var(--input-text) !important; font-size: 15px; outline: none; -webkit-appearance: none; transition: border-color 0.2s, box-shadow 0.2s; } 
        .form-control::placeholder { color: var(--input-placeholder); }
        .form-control:focus, .form-select:focus { border-color: var(--accent-primary) !important; box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15); }
        textarea.form-control { resize: vertical; min-height: 80px; font-family: inherit; line-height: 1.5; } 

        .btn-submit { width: 100%; padding: 16px; border: none; border-radius: 14px; font-weight: 700; font-size: 15px; color: #fff; margin-top: 10px; cursor: pointer; background: var(--accent-primary); box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3);} .btn-submit:active { transform: scale(0.98); }
        .btn-pay { background: var(--success-green); color: #fff; width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: 0 4px 14px rgba(52, 199, 89, 0.3);} .btn-pay:active { transform: scale(0.98); }
        .loader { text-align: center; padding: 40px; color: var(--text-muted); font-weight: 500; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://i.postimg.cc/wvF7Hr48/chutoanfoto2026-logo-new.png" alt="ChuToan Foto Logo">
        <div class="status-badge"><span class="status-dot"></span> Đã kết nối</div>
    </div>

    <div class="container">
        <div class="calendar-swipe-header" id="swipeHandle">
            <div class="calendar-title-text">LỊCH CHỤP</div>
        </div>
        
        <div id="bookingList"><div class="loader">Đang tải dữ liệu...</div></div>

        <div class="section-title" style="margin-top: 32px;">THỐNG KÊ DOANH THU</div>
        <div style="display: flex; gap: 10px; margin-bottom: 14px;">
            <select id="filterYear" class="select-filter glass-fx" style="flex: 1;" onchange="updateStatsUI()"><option value="ALL">Tất cả các năm</option></select>
            <select id="filterMonth" class="select-filter glass-fx" style="flex: 1;" onchange="updateStatsUI()">
                <option value="ALL">Tổng cả năm</option><option value="0">Tháng 1</option><option value="1">Tháng 2</option><option value="2">Tháng 3</option><option value="3">Tháng 4</option><option value="4">Tháng 5</option><option value="5">Tháng 6</option><option value="6">Tháng 7</option><option value="7">Tháng 8</option><option value="8">Tháng 9</option><option value="9">Tháng 10</option><option value="10">Tháng 11</option><option value="11">Tháng 12</option>
            </select>
        </div>

        <div class="stats-grid">
            <div class="stat-card glass-fx"><div class="stat-label">Tổng Doanh Thu</div><div class="stat-value gold" id="totalRevenue">0 đ</div></div>
            <div class="stat-card glass-fx"><div class="stat-label">Đã Thu Thực Tế</div><div class="stat-value green" id="totalCollected">0 đ</div></div>
            <div class="stat-card glass-fx"><div class="stat-label">Chưa Thanh Toán</div><div class="stat-value red" id="totalDebt">0 đ</div></div>
            <div class="stat-card glass-fx"><div class="stat-label">Tổng số Job</div><div class="stat-value" id="totalShows">0</div></div>
        </div>
    </div>

    <div class="fab" onclick="openModal()">+</div>

    <div class="modal" id="modalForm" onclick="if(event.target === this) closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header"><h3 id="modalTitle">Tạo Lịch Mới</h3><span class="close-btn" onclick="closeModal()">✕</span></div>
            
            <div id="tab-create" class="tab-panel active">
                <form id="formCreate" onsubmit="submitCreate(event)">
                    <div class="form-group"><label>Ngày chụp</label><input type="date" id="c_ngay" class="form-control" required></div>
                    <div class="form-group"><label>Thời gian (Sáng/Chiều/Tối)</label><input type="text" id="c_thoigian" class="form-control" placeholder="Ví dụ: Sáng 7h"></div>
                    <div class="form-group"><label>Khách hàng (Tên)</label><input type="text" id="c_khach" class="form-control" required placeholder="Tên khách hàng"></div>
                    <div class="form-group"><label>Địa điểm chụp</label><input type="text" id="c_diadiem" class="form-control" placeholder="Nơi chụp chính"></div>
                    
                    <div class="form-group">
                        <label>Gói dịch vụ</label>
                        <select id="c_noidung" class="form-select">
                            <option value="Phóng Sự Cưới">Phóng Sự Cưới</option><option value="Ăn Hỏi">Ăn Hỏi</option><option value="Chụp Studio">Chụp Studio</option><option value="Sự Kiện">Sự Kiện</option><option value="Tốt Nghiệp">Tốt Nghiệp</option><option value="Kỷ Yếu Đơn">Kỷ Yếu Đơn</option><option value="Kỷ Yếu Nhóm 2">Kỷ Yếu Nhóm 2</option><option value="Kỷ Yếu Nhóm 3">Kỷ Yếu Nhóm 3</option><option value="Khác">Khác</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Giá gói chụp (VNĐ)</label><input type="text" id="c_gia" class="form-control money-input" placeholder="0"></div>
                    <div class="form-group"><label>Phí đi lại (VNĐ)</label><input type="text" id="c_phi" class="form-control money-input" placeholder="0"></div>
                    <div class="form-group"><label>Tiền cọc (VNĐ)</label><input type="text" id="c_coc" class="form-control money-input" placeholder="0"></div>
                    <div class="form-group"><label>Số điện thoại khách (Để gọi)</label><input type="tel" id="c_sdt" class="form-control" placeholder="Ví dụ: 0987654321"></div>
                    
                    <div class="form-group"><label>Ghi chú / Timeline</label><textarea id="c_ghichu" class="form-control" rows="3" placeholder="Nhập lịch trình chi tiết..."></textarea></div>
                    
                    <div class="form-group"><label>Link Maps (Vị trí)</label><input type="url" id="c_linkmaps" class="form-control" placeholder="https://maps.app.goo.gl/..."></div>
                    <div style="display:flex; gap:10px;">
                        <div class="form-group" style="flex:1;"><label>Link FB</label><input type="url" id="c_linkfb" class="form-control" placeholder="https://fb.com/..."></div>
                        <div class="form-group" style="flex:1;"><label>SĐT Zalo</label><input type="tel" id="c_zalo" class="form-control" placeholder="0987654321"></div>
                    </div>
                    <div class="form-group"><label>Link Instagram</label><input type="url" id="c_ig" class="form-control" placeholder="https://instagram.com/..."></div>
                    <div class="form-group"><label>Link Drive (Bàn giao)</label><input type="url" id="c_linkdrive" class="form-control" placeholder="https://drive.google.com/..."></div>
                    
                    <button type="submit" class="btn-submit" id="btnCreate">Tạo Lịch & Đồng Bộ</button>
                </form>
            </div>

            <div id="tab-edit" class="tab-panel">
                <form id="formEdit" onsubmit="submitEdit(event)">
                    <input type="hidden" id="e_rowindex">
                    <div class="form-group"><label>Ngày chụp</label><input type="date" id="e_ngay" class="form-control" required></div>
                    <div class="form-group"><label>Thời gian (Sáng/Chiều/Tối)</label><input type="text" id="e_thoigian" class="form-control"></div>
                    <div class="form-group"><label>Khách hàng (Tên)</label><input type="text" id="e_khach" class="form-control" required></div>
                    <div class="form-group"><label>Địa điểm chụp</label><input type="text" id="e_diadiem" class="form-control"></div>
                    
                    <div class="form-group">
                        <label>Gói dịch vụ</label>
                        <select id="e_noidung" class="form-select">
                            <option value="Phóng Sự Cưới">Phóng Sự Cưới</option><option value="Ăn Hỏi">Ăn Hỏi</option><option value="Chụp Studio">Chụp Studio</option><option value="Sự Kiện">Sự Kiện</option><option value="Tốt Nghiệp">Tốt Nghiệp</option><option value="Kỷ Yếu Đơn">Kỷ Yếu Đơn</option><option value="Kỷ Yếu Nhóm 2">Kỷ Yếu Nhóm 2</option><option value="Kỷ Yếu Nhóm 3">Kỷ Yếu Nhóm 3</option><option value="Khác">Khác</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Giá gói chụp (VNĐ)</label><input type="text" id="e_gia" class="form-control money-input"></div>
                    <div class="form-group"><label>Phí đi lại (VNĐ)</label><input type="text" id="e_phi" class="form-control money-input"></div>
                    <div class="form-group"><label>Tiền cọc (VNĐ)</label><input type="text" id="e_coc" class="form-control money-input"></div>
                    <div class="form-group"><label>Số điện thoại khách (Để gọi)</label><input type="tel" id="e_sdt" class="form-control" placeholder="Ví dụ: 0987654321"></div>
                    
                    <div class="form-group"><label>Ghi chú / Timeline</label><textarea id="e_ghichu" class="form-control" rows="3"></textarea></div>

                    <div class="form-group"><label>Link Maps (Vị trí)</label><input type="url" id="e_linkmaps" class="form-control" placeholder="https://maps.app.goo.gl/..."></div>
                    <div style="display:flex; gap:10px;">
                        <div class="form-group" style="flex:1;"><label>Link FB</label><input type="url" id="e_linkfb" class="form-control" placeholder="https://fb.com/..."></div>
                        <div class="form-group" style="flex:1;"><label>SĐT Zalo</label><input type="tel" id="e_zalo" class="form-control" placeholder="0987654321"></div>
                    </div>
                    <div class="form-group"><label>Link Instagram</label><input type="url" id="e_ig" class="form-control" placeholder="https://instagram.com/..."></div>
                    <div class="form-group"><label>Link Drive (Bàn giao)</label><input type="url" id="e_linkdrive" class="form-control" placeholder="https://drive.google.com/..."></div>
                    
                    <button type="submit" class="btn-submit" id="btnEdit">Lưu Cập Nhật</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyxTm4XHr7HF1WujMPs9oWARimjrmkUV50hbV0ko59oj1njSyWg7rQd1T4PryjGbeJm/exec";
        let allValidData = []; let isFirstLoad = true;
        const FB_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>`;
        const ZALO_ICON = `<span style="background:#0068FF; color:#fff; font-size:10px; font-weight:800; padding:0 6px; border-radius:6px; height:18px; line-height:18px; display:inline-block;">Zalo</span>`;
        const IG_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E1306C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>`;

        function saveUIState() {
            let state = {
                shows: Array.from(document.querySelectorAll('.show')).map(el => el.id).filter(id => id),
                hiddens: Array.from(document.querySelectorAll('.hidden-step')).map(el => el.id).filter(id => id)
            };
            localStorage.setItem('chutoanUIState', JSON.stringify(state));
        }

        function restoreUIState() {
            let saved = localStorage.getItem('chutoanUIState');
            if (!saved) return;
            let state = JSON.parse(saved);

            document.querySelectorAll('.show').forEach(el => {
                el.classList.remove('show');
                if(el.previousElementSibling && el.previousElementSibling.querySelector('.toggle-icon')) {
                    el.previousElementSibling.querySelector('.toggle-icon').style.transform = 'rotate(0deg)';
                }
            });

            state.shows.forEach(id => {
                let el = document.getElementById(id);
                if (el) {
                    el.classList.add('show');
                    if(el.previousElementSibling && el.previousElementSibling.querySelector('.toggle-icon')) {
                        el.previousElementSibling.querySelector('.toggle-icon').style.transform = 'rotate(180deg)';
                    }
                }
            });

            state.hiddens.forEach(id => {
                let el = document.getElementById(id);
                if (el) el.classList.add('hidden-step');
            });
        }

        let touchStartY = 0; let isSwiping = false;
        document.addEventListener('touchstart', function(e) {
            if (window.scrollY <= 10) { touchStartY = e.touches[0].clientY; isSwiping = true; }
        }, {passive: true});

        document.addEventListener('touchend', function(e) {
            if (!isSwiping) return;
            let deltaY = e.changedTouches[0].clientY - touchStartY;
            if (deltaY < -60) { hideNextStep(); } 
            else if (deltaY > 60) { showNextStep(); }
            isSwiping = false;
        });

        document.getElementById('swipeHandle').addEventListener('click', function() {
            let hidden = document.querySelectorAll('.hidden-step');
            if (hidden.length > 0) { hidden.forEach(el => el.classList.remove('hidden-step')); saveUIState(); } 
            else { hideNextStep(); hideNextStep(); hideNextStep(); hideNextStep(); }
        });

        function hideNextStep() {
            let todayObj = new Date(); todayObj.setHours(0,0,0,0);
            let currentYear = todayObj.getFullYear(); let currentMonth = todayObj.getMonth() + 1;

            let pastDays = [];
            document.querySelectorAll('.day-block').forEach(el => {
                let y = parseInt(el.getAttribute('data-year')); let m = parseInt(el.getAttribute('data-month')); let d = parseInt(el.getAttribute('data-day'));
                if (y && m && d) {
                    let elDate = new Date(y, m - 1, d);
                    if (elDate < todayObj && !el.classList.contains('hidden-step')) { pastDays.push(el); }
                }
            });

            if (pastDays.length > 0) { pastDays.forEach(el => el.classList.add('hidden-step')); setTimeout(saveUIState, 100); return; }

            let futureYears = Array.from(document.querySelectorAll('.year-block')).filter(el => parseInt(el.getAttribute('data-year')) > currentYear && !el.classList.contains('hidden-step'));
            if (futureYears.length > 0) {
                futureYears.sort((a, b) => parseInt(b.getAttribute('data-year')) - parseInt(a.getAttribute('data-year')));
                futureYears[0].classList.add('hidden-step'); setTimeout(saveUIState, 100); return;
            }

            let pastItems = [];
            document.querySelectorAll('.year-block').forEach(el => {
                if (parseInt(el.getAttribute('data-year')) < currentYear && !el.classList.contains('hidden-step')) pastItems.push(el);
            });
            document.querySelectorAll('.month-block').forEach(el => {
                let y = parseInt(el.getAttribute('data-year')); let m = parseInt(el.getAttribute('data-month'));
                if ((y < currentYear || (y === currentYear && m < currentMonth)) && !el.classList.contains('hidden-step')) pastItems.push(el);
            });

            if (pastItems.length > 0) { pastItems.forEach(el => el.classList.add('hidden-step')); setTimeout(saveUIState, 100); }
        }

        function showNextStep() {
            let todayObj = new Date(); todayObj.setHours(0,0,0,0);
            let currentYear = todayObj.getFullYear(); let currentMonth = todayObj.getMonth() + 1;

            let pastItems = [];
            document.querySelectorAll('.year-block').forEach(el => {
                if (parseInt(el.getAttribute('data-year')) < currentYear && el.classList.contains('hidden-step')) pastItems.push(el);
            });
            document.querySelectorAll('.month-block').forEach(el => {
                let y = parseInt(el.getAttribute('data-year')); let m = parseInt(el.getAttribute('data-month'));
                if ((y < currentYear || (y === currentYear && m < currentMonth)) && el.classList.contains('hidden-step')) pastItems.push(el);
            });

            if (pastItems.length > 0) { pastItems.forEach(el => el.classList.remove('hidden-step')); setTimeout(saveUIState, 100); return; }

            let futureYears = Array.from(document.querySelectorAll('.year-block')).filter(el => parseInt(el.getAttribute('data-year')) > currentYear && el.classList.contains('hidden-step'));
            if (futureYears.length > 0) {
                futureYears.sort((a, b) => parseInt(a.getAttribute('data-year')) - parseInt(b.getAttribute('data-year')));
                futureYears[0].classList.remove('hidden-step'); setTimeout(saveUIState, 100); return;
            }

            let pastDays = [];
            document.querySelectorAll('.day-block').forEach(el => {
                let y = parseInt(el.getAttribute('data-year')); let m = parseInt(el.getAttribute('data-month')); let d = parseInt(el.getAttribute('data-day'));
                if (y && m && d) {
                    let elDate = new Date(y, m - 1, d);
                    if (elDate < todayObj && el.classList.contains('hidden-step')) { pastDays.push(el); }
                }
            });

            if (pastDays.length > 0) { pastDays.forEach(el => el.classList.remove('hidden-step')); setTimeout(saveUIState, 100); }
        }

        function parseNum(val) { if (val === undefined || val === null) return 0; let str = String(val).replace(/\D/g, ''); return parseInt(str, 10) || 0; }
        function formatMoney(num) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(parseNum(num)); }
        function formatInputMoney(num) { let n = parseNum(num); return n === 0 ? '' : new Intl.NumberFormat('vi-VN').format(n); }
        function findVal(row, keyword) { if (!row) return ''; let key = Object.keys(row).find(k => k.toLowerCase().includes(keyword.toLowerCase())); return key ? row[key] : ''; }

        function parseDateCustom(str) {
            if (!str) return null; str = str.toString().trim();
            if (/^\d{4}-\d{1,2}-\d{1,2}/.test(str)) { let parts = str.split('T')[0].split('-'); return new Date(parts[0], parts[1] - 1, parts[2]); }
            if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(str)) { let parts = str.split('/'); return new Date(parts[2], parts[1] - 1, parts[0]); }
            let d = new Date(str); return isNaN(d.getTime()) ? null : d;
        }

        function formatDateDisplay(d) {
            if (!d) return '--'; let day = ("0" + d.getDate()).slice(-2); let month = ("0" + (d.getMonth() + 1)).slice(-2); let year = d.getFullYear(); return `${day}/${month}/${year}`;
        }
        function dateToISO(dObj) {
            if (!dObj) return ''; let year = dObj.getFullYear(); let month = ("0" + (dObj.getMonth() + 1)).slice(-2); let day = ("0" + dObj.getDate()).slice(-2); return `${year}-${month}-${day}`;
        }

        async function loadData() {
            const cachedData = localStorage.getItem('chutoanFotoCache');
            if (cachedData && isFirstLoad) { try { renderUI(JSON.parse(cachedData)); } catch(e) {} }

            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                localStorage.setItem('chutoanFotoCache', JSON.stringify(data));
                renderUI(data); 
            } catch (e) { 
                if (!localStorage.getItem('chutoanFotoCache')) document.getElementById('bookingList').innerHTML = '<div class="loader" style="color:var(--alert-red)">Lỗi mạng. Vui lòng kiểm tra lại!</div>'; 
            }
        }

        function silentFetchData() {
            fetch(API_URL).then(res => res.json()).then(data => { localStorage.setItem('chutoanFotoCache', JSON.stringify(data)); }).catch(e => console.log(e));
        }

        function renderUI(data) {
            const list = document.getElementById('bookingList');
            if (data.length === 0) { list.innerHTML = '<div class="loader">Chưa có lịch chụp nào.</div>'; return; }

            let validData = data.filter(r => r['Khách hàng'] || findVal(r, 'khách'));
            validData.forEach(r => { let dateStr = r['Ngày chụp'] || findVal(r, 'ngày'); r._dateObj = parseDateCustom(dateStr); });
            validData.sort((a, b) => { if (!a._dateObj) return 1; if (!b._dateObj) return -1; return a._dateObj - b._dateObj; }); 
            allValidData = validData;

            let yearsForStats = [...new Set(allValidData.map(r => r._dateObj ? r._dateObj.getFullYear() : null).filter(y => y !== null))].sort((a,b) => b-a);
            let yearSelect = document.getElementById('filterYear'); let currentSelectedYear = yearSelect.value;
            yearSelect.innerHTML = `<option value="ALL">Tất cả các năm</option>`;
            yearsForStats.forEach(y => { let selected = (y.toString() === currentSelectedYear) ? 'selected' : ''; yearSelect.insertAdjacentHTML('beforeend', `<option value="${y}" ${selected}>Năm ${y}</option>`); });

            if (isFirstLoad) {
                const now = new Date(); let currentY = now.getFullYear().toString(); let currentM = now.getMonth().toString();
                if (yearsForStats.includes(parseInt(currentY))) { yearSelect.value = currentY; } document.getElementById('filterMonth').value = currentM;
                isFirstLoad = false;
            }

            let groupedData = {};
            validData.forEach(row => {
                let dObj = row._dateObj;
                let yearStr = dObj ? dObj.getFullYear().toString() : 'Chưa Rõ';
                let monthStr = dObj ? `Tháng ${dObj.getMonth() + 1}` : 'Tháng Chưa Rõ';
                let displayDate = dObj ? formatDateDisplay(dObj) : (findVal(row, 'ngày') || 'Không rõ ngày');

                let timeStr = (findVal(row, 'thời gian') || '').toString().trim().toLowerCase();
                let sessionStr = 'Khác';
                if (timeStr.startsWith('sáng')) sessionStr = 'Sáng';
                else if (timeStr.startsWith('chiều')) sessionStr = 'Chiều';
                else if (timeStr.startsWith('tối') || timeStr.startsWith('đêm')) sessionStr = 'Tối';
                else if (timeStr !== '') sessionStr = 'Khác';

                if (!groupedData[yearStr]) groupedData[yearStr] = {};
                if (!groupedData[yearStr][monthStr]) groupedData[yearStr][monthStr] = {};
                if (!groupedData[yearStr][monthStr][displayDate]) groupedData[yearStr][monthStr][displayDate] = {};
                if (!groupedData[yearStr][monthStr][displayDate][sessionStr]) groupedData[yearStr][monthStr][displayDate][sessionStr] = [];
                
                groupedData[yearStr][monthStr][displayDate][sessionStr].push(row);
            });

            let sortedYears = Object.keys(groupedData).sort((a, b) => b.localeCompare(a));
            const sessionOrder = { 'Sáng': 1, 'Chiều': 2, 'Tối': 3, 'Khác': 4 };
            const sessionIcons = { 'Sáng': '⛅', 'Chiều': '🌇', 'Tối': '🌙', 'Khác': '📌' };

            let htmlStr = ''; let yIndex = 0;
            sortedYears.forEach(yearStr => {
                let isYearShow = (yIndex === 0) ? 'show' : '';
                let iconRotate = (yIndex === 0) ? 'rotate(180deg)' : 'rotate(0deg)';
                let yearNum = parseInt(yearStr);

                htmlStr += `<div class="year-block" id="yb-${yIndex}" data-year="${yearNum}"><div class="year-header" id="yh-${yIndex}" onclick="toggleSection('year-content-${yIndex}', this)"><span>🗓 NĂM ${yearStr}</span><span class="toggle-icon" style="transform: ${iconRotate}">▼</span></div><div class="year-content ${isYearShow}" id="year-content-${yIndex}">`;
                
                let mIndex = 0;
                for (let monthStr in groupedData[yearStr]) {
                    let monthNum = parseInt(monthStr.replace(/\D/g, '')) || 0;
                    htmlStr += `<div class="month-block" id="mb-${yIndex}-${mIndex}" data-year="${yearNum}" data-month="${monthNum}"><div class="month-header glass-fx" id="mh-${yIndex}-${mIndex}" onclick="toggleSection('month-content-${yIndex}-${mIndex}', this)"><span>📅 ${monthStr}</span><span class="toggle-icon">▼</span></div><div class="month-content" id="month-content-${yIndex}-${mIndex}">`;
                    let dIndex = 0;
                    
                    for (let dateStr in groupedData[yearStr][monthStr]) {
                        let dayNum = dateStr.includes('/') ? parseInt(dateStr.split('/')[0]) : 0;
                        htmlStr += `<div class="day-block" id="db-${yIndex}-${mIndex}-${dIndex}" data-year="${yearNum}" data-month="${monthNum}" data-day="${dayNum}"><div class="day-header glass-fx" id="dh-${yIndex}-${mIndex}-${dIndex}" onclick="toggleSection('day-content-${yIndex}-${mIndex}-${dIndex}', this)"><span>🗓️ ${dateStr}</span><span class="toggle-icon">▼</span></div><div class="day-content" id="day-content-${yIndex}-${mIndex}-${dIndex}">`;
                        
                        let sessionsInDay = Object.keys(groupedData[yearStr][monthStr][dateStr]).sort((a, b) => sessionOrder[a] - sessionOrder[b]);
                        
                        sessionsInDay.forEach(session => {
                            htmlStr += `<div class="session-divider"><span>${sessionIcons[session]} BUỔI ${session}</span></div>`;

                            groupedData[yearStr][monthStr][dateStr][session].forEach(row => {
                                let gia = parseNum(findVal(row, 'giá')); let phi = parseNum(findVal(row, 'phí')); let coc = parseNum(findVal(row, 'cọc'));
                                let conLai = parseNum(findVal(row, 'còn lại')); let rowIndex = row['_rowIndex'];
                                
                                let mapsVal = findVal(row, 'maps') || row['Link Maps'] || '';
                                let driveVal = findVal(row, 'drive') || row['Link Drive'] || '';
                                let fbVal = findVal(row, 'facebook') || row['Link Facebook'] || '';
                                let zaloVal = findVal(row, 'zalo') || row['SĐT Zalo'] || '';
                                let igVal = findVal(row, 'instagram') || findVal(row, 'ig') || row['Link Instagram'] || '';
                                
                                let sdtVal = findVal(row, 'sđt') || findVal(row, 'điện thoại') || row['SĐT'] || '';
                                let noteVal = findVal(row, 'ghi chú');
                                let rawClientName = row['Khách hàng'] || findVal(row, 'khách');

                                let socialLinks = '';
                                if (fbVal) socialLinks += `<a href="${fbVal}" target="_blank" class="social-icon" onclick="event.stopPropagation()">${FB_ICON}</a>`;
                                if (zaloVal) {
                                    let zPhone = String(zaloVal).replace(/\D/g, '');
                                    if (zPhone.length === 9 && !zPhone.startsWith('0')) zPhone = '0' + zPhone; 
                                    if (zPhone.startsWith('84') && zPhone.length === 11) zPhone = '0' + zPhone.slice(2);
                                    socialLinks += `<a href="https://zalo.me/${zPhone}" target="_blank" class="social-icon" onclick="event.stopPropagation()">${ZALO_ICON}</a>`;
                                }
                                if (igVal) socialLinks += `<a href="${igVal}" target="_blank" class="social-icon" onclick="event.stopPropagation()">${IG_ICON}</a>`;

                                let clientNameHTML = `<div class="client-name-container">
                                    <span>${rawClientName}</span>
                                    ${socialLinks ? `<div class="social-links-row">${socialLinks}</div>` : ''}
                                </div>`;

                                let sdtHTML = '';
                                if (sdtVal) {
                                    let cleanPhone = sdtVal.toString().replace(/[^\d+]/g, '');
                                    if (cleanPhone.length === 9 && !cleanPhone.startsWith('0')) cleanPhone = '0' + cleanPhone;
                                    if (cleanPhone.startsWith('84') && cleanPhone.length === 11) cleanPhone = '0' + cleanPhone.slice(2);
                                    
                                    sdtHTML = `<div class="location-row" style="margin-top: -8px; margin-bottom: 12px;">
                                        <span class="location-label">📞 SĐT:</span>
                                        <span class="location-value"><a href="tel:${cleanPhone}" style="color: var(--accent-primary); font-weight: 700; text-decoration: none;" onclick="event.stopPropagation()">${cleanPhone}</a></span>
                                    </div>`;
                                }

                                let moneyStatusHTML = conLai > 0 ? `<span class="debt">Còn nợ: ${formatMoney(conLai)}</span>` : `<span class="paid">Đã tất toán ✓</span>`;

                                let mapsBtn = mapsVal ? `<a href="${mapsVal}" target="_blank" class="action-link-btn maps" onclick="event.stopPropagation()">📍 Maps</a>` : '';
                                let driveBtn = driveVal ? `<a href="${driveVal}" target="_blank" class="action-link-btn drive" onclick="event.stopPropagation()">📁 Drive</a>` : '';
                                let linkButtonsHTML = (mapsBtn || driveBtn) ? `<div class="action-links">${mapsBtn}${driveBtn}</div>` : '';

                                let paidBtnHTML = '';
                                if (conLai > 0) { paidBtnHTML = `<div style="margin-top: 12px;" onclick="event.stopPropagation()"><button class="btn-pay" onclick="markPaid(${rowIndex}, '${rawClientName}')">✓ Đã Thanh Toán</button></div>`; }

                                let noteHTML = '';
                                if (noteVal) { noteHTML = `<div class="detail-note" onclick="event.stopPropagation()"><div class="detail-note-label">📝 Ghi chú / Timeline</div><div class="detail-note-content">${noteVal}</div></div>`; }

                                htmlStr += `
                                    <div class="card glass-fx" onclick="toggleSection('expanded-${rowIndex}', this, true)">
                                        <div class="card-header">
                                            <div><h2 class="client-name">${clientNameHTML}</h2><span class="tag-package">${findVal(row, 'nội dung') || 'Gói Chụp'}</span></div>
                                            <span class="tag-session">${findVal(row, 'thời gian') || 'Cả ngày'}</span>
                                        </div>
                                        <div class="location-row"><span class="location-label">📍 Địa điểm:</span><span class="location-value">${findVal(row, 'địa điểm') || '--'}</span></div>
                                        ${sdtHTML}
                                        ${linkButtonsHTML}
                                        <div class="money-bar"><span class="total">Tổng: <span class="total-num">${formatMoney(gia + phi)}</span></span>${moneyStatusHTML}</div>
                                        <div class="card-expanded-content" id="expanded-${rowIndex}">
                                            <div class="detail-item"><span>Phí đi lại</span><span>${formatMoney(phi)}</span></div>
                                            <div class="detail-item"><span>Tiền cọc</span><span>${formatMoney(coc)}</span></div>
                                            ${noteHTML}
                                            ${paidBtnHTML}
                                            <div class="card-btns-row" onclick="event.stopPropagation()">
                                                <button class="btn-card-action btn-edit" onclick="openEditModal(${rowIndex}, '${rawClientName}')">✏️ Sửa Lịch</button>
                                                <button class="btn-card-action btn-delete" onclick="deleteBooking(${rowIndex}, '${rawClientName}')">🗑️ Xóa Lịch</button>
                                            </div>
                                        </div>
                                    </div>`;
                            });
                        });
                        htmlStr += `</div></div>`; dIndex++;
                    }
                    htmlStr += `</div></div>`; mIndex++;
                }
                htmlStr += `</div></div>`; yIndex++;
            });
            list.innerHTML = htmlStr; updateStatsUI();
            restoreUIState();
        }

        function toggleSection(id, headerEl, isCard = false) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.toggle('show');
                if (!isCard) { const icon = headerEl.querySelector('.toggle-icon'); icon.style.transform = el.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)'; }
                setTimeout(saveUIState, 100);
            }
        }

        function updateStatsUI() {
            let fYear = document.getElementById('filterYear').value; 
            let fMonth = document.getElementById('filterMonth').value; 
            let tRev = 0, tPaid = 0, tDebt = 0;
            let uniqueClients = new Set();
            
            allValidData.forEach(row => {
                let dObj = row._dateObj; let matchY = true, matchM = true;
                if (fYear !== "ALL") { if (!dObj || dObj.getFullYear().toString() !== fYear) matchY = false; }
                if (fMonth !== "ALL") { if (!dObj || dObj.getMonth().toString() !== fMonth) matchM = false; }
                if (matchY && matchM) {
                    let gia = parseNum(findVal(row, 'giá')); let phi = parseNum(findVal(row, 'phí')); let coc = parseNum(findVal(row, 'cọc')); 
                    let tt = parseNum(findVal(row, 'thanh toán thêm')) || 0; let conLai = parseNum(findVal(row, 'còn lại'));
                    
                    tRev += (gia + phi); tPaid += (coc + tt); tDebt += conLai; 
                    
                    let clientName = (row['Khách hàng'] || findVal(row, 'khách') || "").toString().trim().toLowerCase();
                    let fbLink = (findVal(row, 'facebook') || row['Link Facebook'] || "").toString().trim().toLowerCase();
                    if(clientName) {
                        uniqueClients.add(clientName + "|" + fbLink);
                    }
                }
            });
            
            document.getElementById('totalRevenue').innerText = formatMoney(tRev); 
            document.getElementById('totalCollected').innerText = formatMoney(tPaid); 
            document.getElementById('totalDebt').innerText = formatMoney(tDebt); 
            document.getElementById('totalShows').innerText = uniqueClients.size;
        }
        
        loadData(); 

        function openModal() { document.getElementById('modalTitle').innerText = "Tạo Lịch Mới"; document.getElementById('tab-create').classList.add('active'); document.getElementById('tab-edit').classList.remove('active'); document.body.classList.add('modal-open'); document.getElementById('modalForm').style.display = 'flex'; }
        function closeModal() { document.body.classList.remove('modal-open'); document.getElementById('modalForm').style.display = 'none'; }

        function openEditModal(rowIndex, name) {
            const item = allValidData.find(r => r._rowIndex === rowIndex); if (!item) return;
            document.getElementById('modalTitle').innerText = `Sửa Lịch: ${name}`; document.getElementById('e_rowindex').value = rowIndex;
            let dObj = item._dateObj; document.getElementById('e_ngay').value = dObj ? dateToISO(dObj) : '';
            document.getElementById('e_thoigian').value = findVal(item, 'thời gian'); document.getElementById('e_khach').value = item['Khách hàng'] || findVal(item, 'khách');
            document.getElementById('e_linkfb').value = findVal(item, 'facebook') || item['Link Facebook'] || ''; 
            
            let zaloEdit = findVal(item, 'zalo') || item['SĐT Zalo'] || '';
            if(zaloEdit) {
                let p = String(zaloEdit).replace(/\D/g, '');
                if(p.length === 9 && !p.startsWith('0')) p = '0'+p;
                document.getElementById('e_zalo').value = p;
            } else { document.getElementById('e_zalo').value = ''; }

            document.getElementById('e_ig').value = findVal(item, 'instagram') || findVal(item, 'ig') || item['Link Instagram'] || '';
            document.getElementById('e_diadiem').value = findVal(item, 'địa điểm'); document.getElementById('e_noidung').value = findVal(item, 'nội dung') || 'Khác';
            document.getElementById('e_gia').value = formatInputMoney(findVal(item, 'giá')); document.getElementById('e_phi').value = formatInputMoney(findVal(item, 'phí')); document.getElementById('e_coc').value = formatInputMoney(findVal(item, 'cọc')); 
            
            let sdtEdit = findVal(item, 'sđt') || findVal(item, 'điện thoại') || item['SĐT'] || '';
            if(sdtEdit) {
                let p = String(sdtEdit).replace(/\D/g, '');
                if(p.length === 9 && !p.startsWith('0')) p = '0'+p;
                document.getElementById('e_sdt').value = p;
            } else { document.getElementById('e_sdt').value = ''; }

            document.getElementById('e_linkmaps').value = findVal(item, 'maps') || item['Link Maps'] || ''; document.getElementById('e_linkdrive').value = findVal(item, 'drive') || item['Link Drive'] || ''; document.getElementById('e_ghichu').value = findVal(item, 'ghi chú');
            document.getElementById('tab-create').classList.remove('active'); document.getElementById('tab-edit').classList.add('active'); document.body.classList.add('modal-open'); document.getElementById('modalForm').style.display = 'flex';
        }

        document.querySelectorAll('.money-input').forEach(input => { input.addEventListener('input', function(e) { let value = e.target.value.replace(/\D/g, ''); e.target.value = value !== '' ? new Intl.NumberFormat('vi-VN').format(value) : ''; }); });

        async function markPaid(rowIndex, name) {
            if (!confirm(`Xác nhận khách hàng "${name}" đã thanh toán toàn bộ số tiền còn lại?`)) return;
            let item = allValidData.find(r => r._rowIndex == rowIndex);
            if (item) { let conLaiKey = Object.keys(item).find(k => k.toLowerCase().includes('còn lại')) || 'Còn lại'; item[conLaiKey] = 0; renderUI(allValidData); }
            fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "MARK_PAID", rowIndex: rowIndex }) }).then(() => silentFetchData());
        }

        async function submitCreate(e) {
            e.preventDefault(); const btn = document.getElementById('btnCreate'); btn.innerText = "Đang đồng bộ..."; btn.style.opacity = 0.7; btn.disabled = true;
            const payload = { action: "CREATE", ngayChup: document.getElementById('c_ngay').value, thoiGian: document.getElementById('c_thoigian').value, khachHang: document.getElementById('c_khach').value, linkFacebook: document.getElementById('c_linkfb').value, zalo: document.getElementById('c_zalo').value, instagram: document.getElementById('c_ig').value, diaDiem: document.getElementById('c_diadiem').value, linkMaps: document.getElementById('c_linkmaps').value, linkDrive: document.getElementById('c_linkdrive').value, noiDung: document.getElementById('c_noidung').value, giaGoi: parseNum(document.getElementById('c_gia').value), phiDiLai: parseNum(document.getElementById('c_phi').value), coc: parseNum(document.getElementById('c_coc').value), ghiChu: document.getElementById('c_ghichu').value, sdt: document.getElementById('c_sdt').value };
            let newItem = { "Ngày chụp": payload.ngayChup, "Thời gian": payload.thoiGian, "Khách hàng": payload.khachHang, "Link Facebook": payload.linkFacebook, "SĐT Zalo": payload.zalo, "Link Instagram": payload.instagram, "Địa điểm": payload.diaDiem, "Link Maps": payload.linkMaps, "Link Drive": payload.linkDrive, "Nội dung": payload.noiDung, "Giá gói": payload.giaGoi, "Phí đi lại": payload.phiDiLai, "Cọc": payload.coc, "Còn lại": (payload.giaGoi + payload.phiDiLai) - payload.coc, "Ghi chú": payload.ghiChu, "SĐT": payload.sdt, "_rowIndex": Date.now() };
            newItem._dateObj = parseDateCustom(payload.ngayChup); allValidData.push(newItem);
            renderUI(allValidData); closeModal(); document.getElementById('formCreate').reset(); btn.innerText = "Tạo Lịch & Đồng Bộ"; btn.style.opacity = 1; btn.disabled = false;
            fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).then(() => silentFetchData());
        }

        async function submitEdit(e) {
            e.preventDefault(); const btn = document.getElementById('btnEdit'); btn.innerText = "Đang lưu..."; btn.style.opacity = 0.7; btn.disabled = true;
            const payload = { action: "EDIT_ROW", rowIndex: document.getElementById('e_rowindex').value, ngayChup: document.getElementById('e_ngay').value, thoiGian: document.getElementById('e_thoigian').value, khachHang: document.getElementById('e_khach').value, linkFacebook: document.getElementById('e_linkfb').value, zalo: document.getElementById('e_zalo').value, instagram: document.getElementById('e_ig').value, noiDung: document.getElementById('e_noidung').value, diaDiem: document.getElementById('e_diadiem').value, linkMaps: document.getElementById('e_linkmaps').value, linkDrive: document.getElementById('e_linkdrive').value, giaGoi: parseNum(document.getElementById('e_gia').value), phiDiLai: parseNum(document.getElementById('e_phi').value), coc: parseNum(document.getElementById('e_coc').value), ghiChu: document.getElementById('e_ghichu').value, sdt: document.getElementById('e_sdt').value };
            let item = allValidData.find(r => r._rowIndex == payload.rowIndex);
            if (item) {
                let keys = Object.keys(item); item[keys.find(k=>k.toLowerCase().includes('ngày')) || 'Ngày chụp'] = payload.ngayChup; item[keys.find(k=>k.toLowerCase().includes('thời gian')) || 'Thời gian'] = payload.thoiGian; item[keys.find(k=>k.toLowerCase().includes('khách')) || 'Khách hàng'] = payload.khachHang; item['Link Facebook'] = payload.linkFacebook; item['SĐT Zalo'] = payload.zalo; item['Link Instagram'] = payload.instagram; item[keys.find(k=>k.toLowerCase().includes('địa điểm')) || 'Địa điểm'] = payload.diaDiem; item['Link Maps'] = payload.linkMaps; item['Link Drive'] = payload.linkDrive; item[keys.find(k=>k.toLowerCase().includes('nội dung')) || 'Nội dung'] = payload.noiDung; item[keys.find(k=>k.toLowerCase().includes('giá')) || 'Giá gói'] = payload.giaGoi; item[keys.find(k=>k.toLowerCase().includes('phí')) || 'Phí đi lại'] = payload.phiDiLai; item[keys.find(k=>k.toLowerCase().includes('cọc')) || 'Cọc'] = payload.coc; let tt = parseNum(findVal(item, 'thanh toán thêm')) || 0; item[keys.find(k=>k.toLowerCase().includes('còn lại')) || 'Còn lại'] = (payload.giaGoi + payload.phiDiLai) - (payload.coc + tt); item[keys.find(k=>k.toLowerCase().includes('ghi chú')) || 'Ghi chú'] = payload.ghiChu; item[keys.find(k=>k.toLowerCase().includes('sđt')) || 'SĐT'] = payload.sdt; item._dateObj = parseDateCustom(payload.ngayChup);
            }
            renderUI(allValidData); closeModal(); btn.innerText = "Lưu Cập Nhật"; btn.style.opacity = 1; btn.disabled = false;
            fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).then(() => silentFetchData());
        }

        async function deleteBooking(rowIndex, name) {
            if (!confirm(`Bạn có chắc chắn muốn XÓA lịch của khách "${name}" không? Thao tác này không thể hoàn tác.`)) return;
            allValidData = allValidData.filter(r => r._rowIndex != rowIndex); renderUI(allValidData);
            fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "DELETE_ROW", rowIndex: rowIndex }) }).then(() => silentFetchData());
        }
    </script>
