<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Quản Lý Lịch Chụp</title>
    <style>
        :root {
            /* Tone Dashboard (Nền chính) */
            --bg-main: #050505;
            --glass-bg-card: rgba(22, 22, 22, 0.75);
            /* Tone iOS 27 Liquid Glass (Form Popup) */
            --glass-bg-modal: rgba(25, 25, 28, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
            --accent-gold: #d4af37;
            --alert-red: #ef4444;
            --success-green: #30D158;
            --blue-accent: #0A84FF;
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            /* Quầng sáng nền */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.08), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(10, 132, 255, 0.08), transparent 30%);
            background-attachment: fixed;
            padding-bottom: 90px;
        }

        /* HEADER DASHBOARD */
        .header {
            padding: 24px 20px;
            position: sticky;
            top: 0; z-index: 50;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 {
            margin: 0; font-size: 20px; font-weight: 700;
            background: linear-gradient(90deg, #0A84FF, #5E5CE6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container { padding: 15px; max-width: 600px; margin: 0 auto; }

        /* THỐNG KÊ KẾ TOÁN */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card {
            background: var(--glass-bg-card); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 14px;
        }
        .stat-label { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
        .stat-value { font-size: 17px; font-weight: 700; }
        .stat-value.gold { color: var(--accent-gold); }
        .stat-value.green { color: var(--success-green); }
        .stat-value.red { color: var(--alert-red); }

        /* DANH SÁCH THẺ (CARDS) */
        .card {
            background: var(--glass-bg-card); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 18px; margin-bottom: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); padding-bottom: 10px;
        }
        .client-name { font-size: 17px; font-weight: 600; color: var(--accent-gold); margin: 0 0 4px 0; }
        .package-name { font-size: 13px; color: var(--text-sub); margin: 0; }
        .shoot-date { font-size: 12px; background: rgba(255,255,255,0.08); padding: 4px 8px; border-radius: 10px; }
        .details-row { display: flex; margin-bottom: 6px; font-size: 13px; }
        .details-label { color: var(--text-sub); width: 75px; }
        .money-status {
            margin-top: 12px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; font-weight: 600; font-size: 14px;
        }
        .debt { color: var(--alert-red); }
        .paid { color: var(--success-green); }

        /* NÚT TẠO LỊCH (+) */
        .fab {
            position: fixed; bottom: 24px; right: 24px; width: 58px; height: 58px;
            background: var(--blue-accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 30px; font-weight: bold;
            box-shadow: 0 6px 20px rgba(10, 132, 255, 0.4);
            cursor: pointer; z-index: 90; transition: transform 0.2s ease;
        }
        .fab:active { transform: scale(0.9); }

        /* MODAL POPUP (CHỨA FORM) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); z-index: 100;
            justify-content: center; align-items: flex-end;
            animation: fadeInModal 0.3s ease;
        }
        @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background: var(--glass-bg-modal);
            border-top: 1px solid var(--glass-border);
            border-radius: 28px 28px 0 0;
            width: 100%; max-width: 600px;
            max-height: 90vh; overflow-y: auto;
            padding: 25px 20px; box-sizing: border-box;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
        .modal-header h3 { margin: 0; font-size: 18px; color: #fff; }
        .close-btn { font-size: 26px; color: var(--text-sub); cursor: pointer; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border-radius: 50%;}

        /* SEGMENTED CONTROL TABS (IOS 27) */
        .segmented-control {
            display: flex; background: rgba(118, 118, 128, 0.24);
            border-radius: 9px; padding: 3px; margin-bottom: 20px;
        }
        .segment {
            flex: 1; text-align: center; padding: 8px 0; font-size: 13px; font-weight: 600;
            color: var(--text-main); border-radius: 7px; cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        .segment.active {
            background: rgba(99, 99, 102, 0.8);
            box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04);
        }

        .tab-panel { display: none; animation: fadeIn 0.3s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* FORM INPUTS BÊN TRONG MODAL */
        .form-group { margin-bottom: 14px; display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; color: var(--text-sub); margin-bottom: 6px; margin-left: 4px; }
        .form-control, .form-select {
            width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px;
            color: #fff; box-sizing: border-box; font-size: 15px; outline: none;
            transition: border 0.3s ease, background 0.3s ease;
        }
        .form-control:focus, .form-select:focus { border-color: var(--blue-accent); background: rgba(255, 255, 255, 0.08); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; }

        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 14px;
            font-weight: 600; font-size: 15px; color: #fff; margin-top: 10px;
            cursor: pointer; transition: transform 0.1s ease;
        }
        .btn:active { transform: scale(0.97); }
        .btn-blue { background: var(--blue-accent); box-shadow: 0 4px 15px rgba(10, 132, 255, 0.3); }
        .btn-green { background: var(--success-green); box-shadow: 0 4px 15px rgba(48, 209, 88, 0.2); color: #000; }

        .loader { text-align: center; padding: 40px; color: var(--text-sub); }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <h1>Studio Manager</h1>
        <div style="font-size: 12px; color: var(--success-green);">● Đã kết nối</div>
    </div>

    <!-- MÀN HÌNH CHÍNH (DASHBOARD) -->
    <div class="container">
        <!-- Dashboard Thống kê -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Tổng Doanh Thu</div>
                <div class="stat-value gold" id="totalRevenue">0 đ</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Đã Thu Thực Tế</div>
                <div class="stat-value green" id="totalCollected">0 đ</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tổng Nợ Chưa Thu</div>
                <div class="stat-value red" id="totalDebt">0 đ</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tổng Số Show</div>
                <div class="stat-value" id="totalShows">0</div>
            </div>
        </div>

        <div style="font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-sub);">LỊCH TRÌNH & HỢP ĐỒNG</div>
        <div id="bookingList"><div class="loader">Đang tải dữ liệu...</div></div>
    </div>

    <!-- NÚT TẠO LỊCH (+) -->
    <div class="fab" onclick="openModal()">+</div>

    <!-- MODAL POPUP FORM -->
    <div class="modal" id="modalForm">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Thao Tác Dữ Liệu</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>

            <!-- TAB ĐIỀU HƯỚNG BÊN TRONG MODAL -->
            <div class="segmented-control">
                <div class="segment active" onclick="switchTab('create')">TẠO LỊCH MỚI</div>
                <div class="segment" onclick="switchTab('update')">CẬP NHẬT THANH TOÁN</div>
            </div>

            <!-- TAB 1: TẠO LỊCH MỚI -->
            <div id="tab-create" class="tab-panel active">
                <form id="formCreate" onsubmit="submitCreate(event)">
                    <div class="form-group"><label>Ngày chụp:</label><input type="date" id="c_ngay" class="form-control" required></div>
                    <div class="form-group"><label>Thời gian (Sáng/Chiều):</label><input type="text" id="c_thoigian" class="form-control" placeholder="Sáng"></div>
                    <div class="form-group"><label>Khách hàng (Tên):</label><input type="text" id="c_khach" class="form-control" required placeholder="Bắt buộc nhập đúng để dễ tìm"></div>
                    <div class="form-group"><label>Địa điểm chụp:</label><input type="text" id="c_diadiem" class="form-control"></div>
                    <div class="form-group">
                        <label>Gói dịch vụ:</label>
                        <select id="c_noidung" class="form-select">
                            <option value="Phóng Sự Cưới">Phóng Sự Cưới</option>
                            <option value="Ăn Hỏi">Ăn Hỏi</option>
                            <option value="Chụp Studio">Chụp Studio</option>
                            <option value="Kỷ Yếu">Kỷ Yếu</option>
                            <option value="Sự Kiện">Sự Kiện</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Giá gói chụp (VNĐ):</label><input type="text" id="c_gia" class="form-control money-input" placeholder="1.500.000"></div>
                    <div class="form-group"><label>Phí đi lại (VNĐ):</label><input type="text" id="c_phi" class="form-control money-input" placeholder="0"></div>
                    <div class="form-group"><label>Tiền cọc (VNĐ):</label><input type="text" id="c_coc" class="form-control money-input" placeholder="0"></div>
                    <div class="form-group"><label>Ghi chú thêm:</label><input type="text" id="c_ghichu" class="form-control"></div>
                    <div class="form-group"><label>Thư mục PC:</label><input type="text" id="c_thumuc" class="form-control" placeholder="D:\DuLieuChup\"></div>
                    <button type="submit" class="btn btn-blue" id="btnCreate">⚡ TẠO LỊCH & ĐỒNG BỘ PRO</button>
                </form>
            </div>

            <!-- TAB 2: CẬP NHẬT THANH TOÁN -->
            <div id="tab-update" class="tab-panel">
                <div style="text-align: center; margin-bottom: 20px; font-weight: 600; font-size: 14px;">TÌM VÀ CẬP NHẬT TRẠNG THÁI THANH TOÁN</div>
                <form id="formUpdate" onsubmit="submitUpdate(event)">
                    <div class="form-group"><label style="text-align: center;">Chọn Ngày/Tháng của Lịch chụp:</label><input type="date" id="u_ngay" class="form-control" required></div>
                    <div class="form-group"><label style="text-align: center;">Tên Khách Hàng (Nhập chính xác):</label><input type="text" id="u_khach" class="form-control" required></div>
                    <div class="form-group"><label style="text-align: center;">Số tiền khách trả thêm (VNĐ):</label><input type="text" id="u_trathem" class="form-control money-input" required placeholder="Để trống nếu thanh toán hết (gõ số tiền)"></div>
                    <button type="submit" class="btn btn-green" id="btnUpdate">✔ XÁC NHẬN ĐÃ THANH TOÁN</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // === ĐIỀN LINK API TỪ GOOGLE APPS SCRIPT VÀO ĐÂY ===
        const API_URL = "https://script.google.com/macros/s/AKfycbyiFlBtGKqz0TbUSIraSrSP81aq0Uos3dLKdF5uzoyZTBGGeArOzQ3fjp8a551HGnm0/exec";

        /* --- XỬ LÝ DASHBOARD --- */
        function formatMoney(num) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num); }
        function parseNum(val) { if (!val) return 0; return parseInt(val.toString().replace(/\./g, '').replace(/,/g, '').replace('đ', '').trim()) || 0; }

        async function loadData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderUI(data);
            } catch (e) { document.getElementById('bookingList').innerHTML = '<div class="loader" style="color:red">Lỗi tải dữ liệu.</div>'; }
        }

        function renderUI(data) {
            let totalRev = 0, totalPaid = 0, totalDebt = 0;
            const list = document.getElementById('bookingList');
            list.innerHTML = '';
            if (data.length === 0) { list.innerHTML = '<div class="loader">Chưa có lịch chụp nào.</div>'; return; }

            data.slice().reverse().forEach(row => {
                let gia = parseNum(row['Giá gói']), phi = parseNum(row['Phí đi lại']);
                let coc = parseNum(row['Cọc']), tt = parseNum(row['Thanh toán thêm']);
                let conLai = parseNum(row['Còn lại']);

                totalRev += (gia + phi);
                totalPaid += (coc + tt);
                totalDebt += conLai;

                let moneyClass = conLai > 0 ? 'debt' : 'paid';
                let moneyText = conLai > 0 ? `Cần thu: ${formatMoney(conLai)}` : 'Đã tất toán ✓';

                list.insertAdjacentHTML('beforeend', `
                    <div class="card">
                        <div class="card-header">
                            <div><h2 class="client-name">${row['Khách hàng']}</h2><p class="package-name">${row['Nội dung'] || 'Chưa ghi'}</p></div>
                            <div class="shoot-date">${row['Ngày chụp']}</div>
                        </div>
                        <div class="details-row"><span class="details-label">Thời gian:</span><span>${row['Thời gian'] || '--'}</span></div>
                        <div class="details-row"><span class="details-label">Địa điểm:</span><span>${row['Địa điểm'] || '--'}</span></div>
                        <div class="money-status ${moneyClass}">
                            <span>Tổng gói: ${formatMoney(gia + phi)}</span>
                            <span>${moneyText}</span>
                        </div>
                    </div>
                `);
            });
            document.getElementById('totalRevenue').innerText = formatMoney(totalRev);
            document.getElementById('totalCollected').innerText = formatMoney(totalPaid);
            document.getElementById('totalDebt').innerText = formatMoney(totalDebt);
            document.getElementById('totalShows').innerText = data.length;
        }
        
        loadData(); // Gọi hàm tải dữ liệu khi vừa mở Web

        /* --- XỬ LÝ MODAL & FORM (IOS 27) --- */
        function openModal() { document.getElementById('modalForm').style.display = 'flex'; }
        function closeModal() { document.getElementById('modalForm').style.display = 'none'; }

        function switchTab(tab) {
            document.querySelectorAll('.segment').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'));
            if(tab === 'create') {
                document.querySelectorAll('.segment')[0].classList.add('active');
                document.getElementById('tab-create').classList.add('active');
            } else {
                document.querySelectorAll('.segment')[1].classList.add('active');
                document.getElementById('tab-update').classList.add('active');
            }
        }

        // Tự động thêm dấu chấm cho tiền
        document.querySelectorAll('.money-input').forEach(input => {
            input.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\./g, '').replace(/\D/g, '');
                if (value !== '') { e.target.value = new Intl.NumberFormat('vi-VN').format(value).replace(/,/g, '.'); } 
                else { e.target.value = ''; }
            });
        });

        // Gửi lệnh TẠO LỊCH
        async function submitCreate(e) {
            e.preventDefault();
            const btn = document.getElementById('btnCreate');
            btn.innerText = "Đang đồng bộ..."; btn.style.opacity = 0.7; btn.disabled = true;

            const payload = {
                action: "CREATE",
                ngayChup: document.getElementById('c_ngay').value,
                thoiGian: document.getElementById('c_thoigian').value,
                khachHang: document.getElementById('c_khach').value,
                diaDiem: document.getElementById('c_diadiem').value,
                noiDung: document.getElementById('c_noidung').value,
                giaGoi: parseNum(document.getElementById('c_gia').value),
                phiDiLai: parseNum(document.getElementById('c_phi').value),
                coc: parseNum(document.getElementById('c_coc').value),
                ghiChu: document.getElementById('c_ghichu').value,
                thuMucPC: document.getElementById('c_thumuc').value
            };
            await sendData(payload, btn, "⚡ TẠO LỊCH & ĐỒNG BỘ PRO");
            document.getElementById('formCreate').reset();
        }

        // Gửi lệnh CẬP NHẬT THANH TOÁN
        async function submitUpdate(e) {
            e.preventDefault();
            const btn = document.getElementById('btnUpdate');
            btn.innerText = "Đang xử lý..."; btn.style.opacity = 0.7; btn.disabled = true;

            const payload = {
                action: "UPDATE",
                ngayChup: document.getElementById('u_ngay').value,
                khachHang: document.getElementById('u_khach').value,
                traThem: parseNum(document.getElementById('u_trathem').value)
            };
            await sendData(payload, btn, "✔ XÁC NHẬN ĐÃ THANH TOÁN");
            document.getElementById('formUpdate').reset();
        }

        async function sendData(payload, btn, originalText) {
            try {
                await fetch(API_URL, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                closeModal(); // Đóng bảng nhập liệu
                setTimeout(loadData, 1500); // Đợi 1.5s rồi load lại Dashboard
            } catch (err) { alert("Lỗi khi lưu dữ liệu!"); } 
            finally { btn.innerText = originalText; btn.style.opacity = 1; btn.disabled = false; }
        }
    </script>
</body>
</html>
